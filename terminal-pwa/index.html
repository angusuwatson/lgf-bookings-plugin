/* ---- Bookings ---- */
function renderBookings(){
    var container=document.getElementById('booking-cards');
    if(state.bookings.length===0){
        container.innerHTML='<div class="text-muted text-sm" style="padding:8px;">No bookings on this date.</div>';
        if(!state.activeBookingId) document.getElementById('ticket-panel').style.display='none';
        return;
    }
    var todayStr=today();
    var cards=state.bookings.map(function(b){
        var isActive=parseInt(b.id,10)===state.activeBookingId;
        var rooms=state.roomsByBooking[b.id]||[];
        var roomLabels=rooms.map(function(r){return r.room_code}).join(', ');
        var name=(b.first_name||'')+' '+(b.last_name||'');
        var isCheckedIn=b.status_code==='checked_in';
        var isCheckedOut=b.status_code==='checked_out';
        var canCheckIn=b.status_code==='confirmed'&&b.check_in_date===todayStr;
        var canCheckOut=isCheckedIn&&b.check_out_date===todayStr;
        var isPaid=b.payment_status==='paid'||b.payment_status==='completed';
        var children=[
            el('div',{className:'booking-name'},[name.trim()||'#'+b.id].concat(isPaid?[el('span',{className:'badge-paid'},['Paid'])]:[]).concat(parseInt(b.dinner_count,10)>0?[' \uD83C\uDF7D\u00D7'+b.dinner_count]:[])),
            el('div',{className:'booking-meta'},[
                '#'+b.id+' · '+b.check_in_date+' → '+b.check_out_date,
                (b.total_amount?' · '+parseFloat(b.total_amount).toFixed(2)+'\u20AC':''),
                (isCheckedIn?' · ✓ In':''),
                (isCheckedOut?' · ✓ Out':''),
            ]),
            roomLabels?el('div',{className:'booking-room'},[roomLabels]):null,
        ];
        if(isPaid){
            children.push(el('button',{className:'btn-receipt-sm',type:'button',title:'Reissue receipt',
                onClick:function(e){e.stopPropagation();reissueReceipt(parseInt(b.id,10));}
            },['🖨']));
        }
        if(canCheckIn){
            children.push(el('div',{style:{marginTop:'6px'}},[
                el('button',{className:'btn-ci',type:'button',onClick:function(e){e.stopPropagation();openCheckinModal(parseInt(b.id,10));}},['Check in']),
            ]));
        }
        if(canCheckOut){
            children.push(el('div',{style:{marginTop:'6px'}},[
                el('button',{className:'btn-co',type:'button',onClick:function(e){e.stopPropagation();doCheckout(parseInt(b.id,10));}},['Check out']),
            ]));
        }
        return el('div',{
            className:isActive?'booking-card-active':'booking-card',
            onClick:function(){selectBooking(parseInt(b.id,10));}
        },children);
    });
    container.innerHTML='';
    cards.forEach(function(c){container.appendChild(c);});
}

function doCheckout(bookingId){
    if(!confirm('Check out booking #'+bookingId+'?')) return;
    apiPost('ticket-departure',{booking_id:bookingId}).then(function(){
        for(var i=0;i<state.bookings.length;i++){
            if(parseInt(state.bookings[i].id,10)===bookingId){
                state.bookings[i].status_code='checked_out';
                break;
            }
        }
        if(state.activeBookingId===bookingId){state.activeBookingId=0;}
        renderBookings();
        if(!state.activeBookingId) document.getElementById('ticket-panel').style.display='none';
    }).catch(function(err){
        if(err.message!=='unauthorized') showError(err.message||'Checkout failed.');
    });
}

/* ---- Catalog ---- */
function renderCatalog(){
    var grid=document.getElementById('item-grid');
    if(state.catalog.length===0){
        grid.innerHTML='<div class="text-muted text-sm" style="padding:20px;">No catalog items. Import CSV in Settings.</div>';
        return;
    }
    var groups={};
    state.catalog.forEach(function(item){
        var cat=item.category||'other';
        if(!groups[cat]) groups[cat]=[];
        groups[cat].push(item);
    });
    var catOrder=['dinner','other','rooms'];
    var catLabels={'rooms':'Rooms','dinner':'Dinner','other':'Other'};
    var catCollapsed={'rooms':true,'dinner':true,'other':true};
    grid.innerHTML='';
    catOrder.forEach(function(cat){
        var items=groups[cat];
        if(!items||items.length===0) return;
        var idx=catOrder.indexOf(cat);
        var collapsed=!!catCollapsed[cat];
        var hdr=el('div',{className:'cat-header',style:{marginTop:idx===0?'0':'10px'}},[
            el('span',{className:'cat-arrow'},[collapsed?'\u25B6':'\u25BC']),
            ' '+(catLabels[cat]||cat)+' ('+items.length+')',
        ]);
        hdr.addEventListener('click',function(){
            var g=this.nextElementSibling;
            var a=this.querySelector('.cat-arrow');
            if(g&&g.classList.contains('item-grid')){
                var h=g.style.display==='none';
                g.style.display=h?'':'none';
                if(a) a.textContent=h?'\u25BC':'\u25B6';
            }
        });
        grid.appendChild(hdr);
        var sub=el('div',{className:'item-grid'});
        if(collapsed) sub.style.display='none';
        items.forEach(function(item){
            sub.appendChild(el('div',{
                className:'item-card',
                onClick:function(){addItem(item);}
            },[
                el('div',{className:'item-name'},[item.item_name]),
                el('div',{className:'item-price'},[parseFloat(item.unit_price).toFixed(2)+'\u20AC']),
            ]));
        });
        grid.appendChild(sub);
    });
}

/* ---- Pricing ---- */
function loadPricing(){
    var d=new Date(state.date+'T12:00:00');
    if(d.getDate()!==1) d.setDate(1);
    state.pricingYear=d.getFullYear();
    state.pricingMonth=d.getMonth()+1;
    updatePricingNavLabel();
    fetchPricingData();
}
function pricingNavMonth(delta){
    state.pricingMonth+=delta;
    if(state.pricingMonth<1){state.pricingMonth=12;state.pricingYear--;}
    if(state.pricingMonth>12){state.pricingMonth=1;state.pricingYear++;}
    updatePricingNavLabel();
    fetchPricingData();
}
function updatePricingNavLabel(){
    var d=new Date(state.pricingYear,state.pricingMonth-1,15);
    document.getElementById('pricing-nav-label').textContent=
        d.toLocaleString('en',{month:'long',year:'numeric'});
}
function fetchPricingData(){
    apiGet('pricing-calendar?year='+state.pricingYear+'&month='+state.pricingMonth).then(function(data){
        state.pricingData=data;
        renderPricingTab();
    }).catch(function(err){
        if(err.message!=='unauthorized') showError('Pricing load failed.');
    });
}
function renderPricingTab(){
    var root=document.getElementById('pricing-content');
    if(!root) return;
    root.innerHTML='';
    var tab=state.pricingTab||'calendar';
    if(tab==='calendar') renderPricingCalendar(root);
    else if(tab==='seasons') renderPricingSeasons(root);
    else if(tab==='events') renderPricingEvents(root);
    else if(tab==='rules') renderPricingRules(root);
    else if(tab==='audit') renderPricingAudit(root);
}

function renderPricingCalendar(root){
    var d=state.pricingData;
    if(!d){root.innerHTML='<div class="pricing-empty">Loading...</div>';return;}

    // Legend
    var legend=el('div',{className:'pricing-legend'},[
        el('span',{className:'pricing-legend-item'},[
            el('span',{className:'pricing-legend-dot',style:'background:#22c55e'}), 'Has rule'
        ]),
        el('span',{className:'pricing-legend-item'},[
            el('span',{className:'pricing-legend-dot',style:'background:var(--muted);opacity:.5'}), 'No rule'
        ]),
        el('span',{className:'pricing-legend-item'},[
            el('span',{className:'pricing-legend-dot',style:'background:#3b82f6'}), 'Actual price set'
        ]),
    ]);
    root.appendChild(legend);

    // Season spans row
    if(d.seasons && d.seasons.length){
        var seasonBar=el('div',{style:'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px'});
        d.seasons.forEach(function(s){
            var badge=el('span',{className:'pricing-badge',style:'background:#8b5cf6;color:#fff;font-size:10px'},[
                s.name+': '+s.from+' → '+s.to+(s.multiplier?' ×'+s.multiplier:s.price_override!==null?' =€'+s.price_override:'')
            ]);
            seasonBar.appendChild(badge);
        });
        root.appendChild(seasonBar);
    }

    // Bulk apply bar
    var bulkBar=el('div',{className:'pp-bulk'},[
        el('button',{className:'pp-bulk-btn',id:'pp-bulk-apply'},['Apply All Suggested']),
        el('button',{className:'pp-bulk-btn secondary',id:'pp-bulk-clear'},['Clear All Actuals']),
    ]);
    root.appendChild(bulkBar);

    // Calendar table
    var tbl=el('table',{className:'pricing-cal',id:'pricing-cal-table'});
    var thead=el('thead');
    var hrow=el('tr');
    hrow.appendChild(el('th',{className:'room-col'},['Room']));
    var numDays=d.day_labels?d.day_labels.length:0;
    for(var i=0;i<numDays;i++){
        var dl=d.day_labels[i];
        var isWk=(dl.dow===0||dl.dow===6);
        hrow.appendChild(el('th',{style:isWk?'color:#f59e0b':''},[''+dl.day]));
    }
    thead.appendChild(hrow);
    tbl.appendChild(thead);

    // Group rooms by room ID, preserving order
    var actualCount=0;
    var totalCells=0;
    var tbody=el('tbody');
    var roomGroups=[];
    var seenIds={};
    if(d.rooms){
        d.rooms.forEach(function(r){
            if(!seenIds[r.id]){
                seenIds[r.id]=[];
                roomGroups.push({id:r.id,number:r.room_number,name:r.room_name,color:r.theme_color,tiers:[]});
            }
            seenIds[r.id].push(r);
        });
        // Fill tiers from the flat rooms array
        roomGroups.forEach(function(g){
            d.rooms.forEach(function(r){
                if(r.id===g.id) g.tiers.push(r);
            });
        });
    }

    roomGroups.forEach(function(group){
        // Room header row
        var htr=el('tr',{className:'pricing-room-header'});
        var htd=el('td',{className:'room-cell pricing-room-header-cell',style:'color:'+group.color},[
            group.number+' '+group.name
        ]);
        htd.setAttribute('colspan',''+(numDays+1));
        htr.appendChild(htd);
        tbody.appendChild(htr);

        // Occupancy sub-rows
        group.tiers.forEach(function(tier){
            var tr=el('tr');
            var occLabel=tier.occupancy_adults+'A';
            tr.appendChild(el('td',{className:'room-cell',style:'color:'+group.color+';padding-left:24px;font-size:11px'},[
                occLabel
            ]));
            tier.prices.forEach(function(p){
                totalCells++;
                var cls='suggested';
                if(p.actual!==null){ cls='has-actual'; actualCount++; }
                if(!p.has_rule) cls='no-rule';
                var wk=(p.dow===0||p.dow===6)?' weekend':'';
                var txt=p.actual!==null?p.actual:p.suggested;
                var td=el('td',{className:cls+wk,'data-room-id':group.id,'data-occupancy':tier.occupancy_adults,'data-date':p.date,'data-suggested':p.suggested,'data-actual':p.actual!==null?p.actual:'','data-room':group.number+' '+group.name},['€'+txt]);
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    });
    tbl.appendChild(tbody);
    root.appendChild(tbl);

    // Count (after table is in DOM)
    var countEl=el('span',{className:'pp-bulk-count'},[actualCount+' of '+totalCells+' cells have actual prices']);
    bulkBar.appendChild(countEl);

    // Click handler on calendar cells
    tbl.addEventListener('click',function(ev){
        var td=ev.target.closest('td[data-room-id]');
        if(!td) return;
        showPricingPopover(td);
    });

    // Bulk apply
    document.getElementById('pp-bulk-apply').addEventListener('click',function(){bulkApplyPricing(false);});
    document.getElementById('pp-bulk-clear').addEventListener('click',function(){bulkApplyPricing(true);});

    // Events list for this month
    if(d.events && d.events.length){
        var evTitle=el('div',{className:'fin-section-title'},['Events This Month']);
        root.appendChild(evTitle);
        d.events.forEach(function(ev){
            var demandCls=ev.demand_level==='high'||ev.demand_level==='very_high'?ev.demand_level:'medium';
            root.appendChild(el('div',{className:'pricing-event-card'},[
                el('div',{className:'pricing-card-header'},[
                    el('span',{className:'pricing-card-title'},[ev.name]),
                    el('span',{className:'pricing-badge '+demandCls},[ev.demand_level]),
                ]),
                el('div',{className:'pricing-card-dates'},[ev.from+' → '+ev.to]),
                el('div',{className:'pricing-card-body'},[
                    ev.multiplier?'×'+ev.multiplier:(ev.adjustment>=0?'+':'')+ev.adjustment+'€ per night'
                ]),
            ]));
        });
    }
}

function showPricingPopover(td){
    var roomId=parseInt(td.getAttribute('data-room-id'));
    var occupancy=parseInt(td.getAttribute('data-occupancy'))||1;
    var date=td.getAttribute('data-date');
    var suggested=parseFloat(td.getAttribute('data-suggested'))||0;
    var actual=td.getAttribute('data-actual');
    var roomName=td.getAttribute('data-room');

    var overlay=el('div',{className:'pp-overlay'});
    var box=el('div',{className:'pp-box'});

    box.appendChild(el('h3',{},[roomName+' ('+occupancy+'A) — '+date]));

    // Suggested row
    box.appendChild(el('div',{className:'pp-row'},[
        el('span',{className:'pp-label'},['Suggested']),
        el('span',{className:'pp-val suggested'},['€'+suggested.toFixed(2)]),
    ]));

    // Actual row
    var actualRow=el('div',{className:'pp-row'},[
        el('span',{className:'pp-label'},['Current']),
        el('span',{className:'pp-val'+(actual?' actual':'')},[actual?'€'+parseFloat(actual).toFixed(2):'—']),
    ]);
    box.appendChild(actualRow);

    // Custom price input
    var customWrap=el('div',{className:'pp-custom'},[
        el('label',{},['Override:']),
    ]);
    var customIn=el('input',{type:'number',step:'0.01',placeholder:suggested.toFixed(2),id:'pp-custom-price'});
    customWrap.appendChild(customIn);
    box.appendChild(customWrap);

    // Apply + Close
    var actions=el('div',{className:'pp-actions'});
    var applyBtn=el('button',{className:'pp-apply'},['Apply']);
    var closeBtn=el('button',{className:'pp-close'},['Close']);
    actions.appendChild(applyBtn);
    actions.appendChild(closeBtn);
    box.appendChild(actions);

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    // Close on overlay click or close button
    overlay.addEventListener('click',function(ev){
        if(ev.target===overlay) overlay.remove();
    });
    closeBtn.addEventListener('click',function(){overlay.remove();});

    // Apply
    applyBtn.addEventListener('click',function(){
        var price=parseFloat(customIn.value);
        if(isNaN(price)||price<=0){showError('Enter a valid price.');return;}
        applyBtn.disabled=true;
        applyBtn.textContent='Applying...';
        apiPost('pricing-apply',{room_id:roomId,occupancy_adults:occupancy,date:date,price:price,reason:'Manual cell apply'}).then(function(){
            overlay.remove();
            // Update local data
            var d=state.pricingData;
            if(d) d.rooms.forEach(function(r){
                if(r.id===roomId && r.occupancy_adults===occupancy) r.prices.forEach(function(p){
                    if(p.date===date){ p.actual=price; }
                });
            });
            renderPricingTab();
        }).catch(function(e){
            applyBtn.disabled=false;
            applyBtn.textContent='Apply';
            showError('Apply failed: '+e.message);
        });
    });
}

function bulkApplyPricing(clear){
    var d=state.pricingData;
    if(!d||!d.rooms||!d.rooms.length) return;
    var items=[];
    d.rooms.forEach(function(room){
        room.prices.forEach(function(p){
            if(clear){
                if(p.actual!==null){
                    items.push({room_id:room.id,occupancy_adults:room.occupancy_adults,date:p.date,action:'clear'});
                }
            }else{
                if(p.actual===null && p.has_rule){
                    items.push({room_id:room.id,occupancy_adults:room.occupancy_adults,date:p.date,price:p.suggested,action:'apply'});
                }
            }
        });
    });
    if(!items.length){
        showError(clear?'No actual prices to clear.':'No cells with rules to apply.');
        return;
    }
    var btn=document.getElementById('pp-bulk-apply');
    var btnC=document.getElementById('pp-bulk-clear');
    if(btn) btn.disabled=true;
    if(btnC) btnC.disabled=true;
    apiPost('pricing-apply-bulk',{items:items,reason:clear?'Bulk clear':'Bulk apply'}).then(function(res){
        fetchPricingData();
    }).catch(function(e){
        if(btn) btn.disabled=false;
        if(btnC) btnC.disabled=false;
        showError('Bulk operation failed: '+e.message);
    });
}

/* ---- Calendar ---- */
function loadCalendar(){
    var d=new Date(state.date+'T12:00:00');
    if(d.getDate()!==1) d.setDate(1);
    state.calDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
    document.getElementById('cal-nav-label').textContent=
        new Date(state.calDate+'T12:00:00').toLocaleString('en',{month:'long',year:'numeric'});
    fetchCalendarData();
}

function fetchCalendarData(){
    apiGet('ticket-calendar?date='+state.calDate+'&days=31').then(function(data){
        state.calRooms=data.rooms||[];
        state.calOccupancy=data.occupancy||[];
        state.calDailyNotes=data.daily_notes||[];
        state.calDinnerCounts=data.dinner_counts||{};
        state.calExtrasMap=data.extras_map||{};
        renderCalendar();
    }).catch(function(err){
        if(err.message!=='unauthorized') showError('Calendar load failed.');
    });
}

function calNavMonth(delta){
    var d=new Date(state.calDate+'T12:00:00');
    d.setMonth(d.getMonth()+delta);
    state.calDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
    document.getElementById('cal-nav-label').textContent=
        new Date(state.calDate+'T12:00:00').toLocaleString('en',{month:'long',year:'numeric'});
    fetchCalendarData();
}

function renderCalendar(){
    var occMap={};
    state.calOccupancy.forEach(function(o){occMap[o.stay_date+'-'+o.room_id]=o;});
    var noteMap={};
    state.calDailyNotes.forEach(function(n){noteMap[n.note_date]=n.note_text;});
    var dinnerMap=state.calDinnerCounts||{};

    var d=new Date(state.calDate+'T12:00:00');
    var year=d.getFullYear();
    var month=d.getMonth();
    var monthLabel=new Date(year,month).toLocaleString('en',{month:'long',year:'numeric'});
    document.getElementById('cal-nav-label').textContent=monthLabel;
    var daysInMonth=new Date(year,month+1,0).getDate();
    var dates=[];
    for(var i=1;i<=daysInMonth;i++){
        var ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
        dates.push(ds);
    }
    var todayStr=today();

    var html='<div class="cal-grid">';
    // Date header row
    html+='<div class="cal-row">';
    html+='<div class="cal-room-col">Room</div>';
    dates.forEach(function(ds){
        var cls='cal-date-col'+(ds===todayStr?' cal-today':'');
        var dt=new Date(ds+'T12:00:00');
        var dayAbbr=dt.toLocaleString('en',{weekday:'short'});
        html+='<div class="'+cls+'">'+String(dt.getDate())+'<br><span style="font-weight:400;font-size:9px">'+dayAbbr+'</span></div>';
    });
    html+='</div>';

    // Daily notes row (above rooms)
    html+='<div class="cal-row">';
    html+='<div class="cal-room-col" style="background:var(--accent);font-weight:600;color:#fff">Notes</div>';
    dates.forEach(function(date){
        var note=noteMap[date];
        var cls='cal-cell cal-free';
        if(date===todayStr) cls+=' cal-today';
        html+='<div class="'+cls+'" style="color:var(--muted);overflow:hidden;text-overflow:ellipsis">'+
            (note?note.slice(0,10):'')+'</div>';
    });
    html+='</div>';

        // Room rows
    var extrasMap=state.calExtrasMap||{};
    state.calRooms.forEach(function(room){
        if(!room.active) return;
        var color=room.color||'var(--border)';
        html+='<div class="cal-row" style="background:'+color+'">';
        html+='<div class="cal-room-col" style="background:'+color+'">'+
            (room.room_code||'')+'</div>';
        dates.forEach(function(date){
            var occ=occMap[date+'-'+room.id];
            var cls='cal-cell';
            var bookingId=0;
            if(occ){
                cls+=' cal-occ-'+(occ.status_code==='checked_in'?'checked_in':'confirmed');
                bookingId=parseInt(occ.booking_id,10);
            }else{
                cls+=' cal-free';
            }
            if(date===todayStr) cls+=' cal-today';
            var extra='';
            if(occ){
                var name=(occ.first_name||'')+' '+(occ.last_name||'');
                var channelAbbr={direct:'D',booking_com:'B',website:'W'}[occ.source_channel]||'';
                var occLine=(parseInt(occ.adults)||0)+'A';
                if(parseInt(occ.children)) occLine+=' '+parseInt(occ.children)+'C';
                if(parseInt(occ.babies)) occLine+=' '+parseInt(occ.babies)+'B';
                if(parseInt(dinnerMap[occ.booking_id],10)>0) occLine+=' \uD83C\uDF7D';
                var extrasAmt=extrasMap[date+'-'+room.id]||0;
                extra='<span class="cal-guest-name">'+name.slice(0,18)+'</span>'+
                    '<span class="cal-occ-line">'+occLine+'</span>'+
                    '<div class="cal-bottom-line">'+
                        '<span class="cal-channel">'+(channelAbbr?channelAbbr:'')+'</span>'+
                        '<div>'+
                            '<span class="cal-price">'+(parseFloat(occ.room_rate_amount)||0).toFixed(0)+'\u20AC</span>'+
                            (extrasAmt>0?'<div class="cal-extras-price">+'+(extrasAmt).toFixed(0)+'\u20AC</div>':'')+
                        '</div>'+
                    '</div>';
            }
            html+='<div class="'+cls+'" data-bid="'+bookingId+'">'+extra+'</div>';
        });
        html+='</div>';
    });

    html+='</div>';
    document.getElementById('cal-view').innerHTML=html;
}

    if(!state.maintNotes) state.maintNotes=[];
    var html='<div class="mt-input-row">';
    html+='<input type="text" id="mt-input" placeholder="What needs fixing..." autocomplete="off">';
    html+='<button id="mt-add-btn">Add</button>';
    html+='</div>';
    if(state.maintNotes.length===0){
        html+='<div class="mt-empty">No maintenance items. Add one above.</div>';
    }else{
        state.maintNotes.forEach(function(note,i){
            html+='<div class="mt-item">';
            html+='<input type="checkbox" class="mt-done"'+(note.done?' checked':'')+' onclick="window._toggleMaintDone('+i+')">';
            html+='<span class="mt-text'+(note.done?' done':'')+'">'+escapeHtml(note.text)+'</span>';
            html+='<span class="mt-date">'+escapeHtml(note.date)+'</span>';
            html+='<button class="mt-del" onclick="window._deleteMaintNote('+i+')">×</button>';
            html+='</div>';
        });
    }
    div.innerHTML=html;
    var inp=document.getElementById('mt-input');
    if(inp) inp.addEventListener('keydown',function(e){if(e.key==='Enter') addMaintNote();});
    var btn=document.getElementById('mt-add-btn');
    if(btn) btn.addEventListener('click',function(){addMaintNote();});
}

function addMaintNote(){
    var inp=document.getElementById('mt-input');
    if(!inp||!inp.value.trim()) return;
    state.maintNotes.push({
        id:Date.now()+'-'+Math.random().toString(36).slice(2,6),
        text:inp.value.trim(),
        date:today(),
        done:false,
    });
    saveMaintNotes();
}

window._toggleMaintDone=function(idx){
    if(state.maintNotes[idx]) state.maintNotes[idx].done=!state.maintNotes[idx].done;
    saveMaintNotes();
};
window._deleteMaintNote=function(idx){
    state.maintNotes.splice(idx,1);
    saveMaintNotes();
};

function saveMaintNotes(){
    var data=state.maintNotes.map(function(n){return {id:n.id,text:n.text,date:n.date,done:n.done};});
    apiPost('ticket-maintenance-notes',{notes:data}).then(function(){
        renderMaintenanceNotes();
    }).catch(function(err){
        if(err.message!=='unauthorized') showError('Failed to save maintenance notes.');
    });
}

function escapeHtml(s){
    if(typeof s!=='string') return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---- Guest Search ---- */
var _gsTimer=0;
function doGuestSearch(){
    var q=document.getElementById('gs-input').value.trim();
    var resultsEl=document.getElementById('gs-results');
    if(q.length<2){
        resultsEl.classList.remove('active');
        return;
    }
    clearTimeout(_gsTimer);
    _gsTimer=setTimeout(function(){
        apiGet('ticket-guest-search?q='+encodeURIComponent(q)).then(function(data){
            showGuestResults(data.guests||[]);
        }).catch(function(err){
            if(err.message!=='unauthorized') showError('Search failed.');
        });
    },300);
}
function showGuestResults(guests){
    var el=document.getElementById('gs-results');
    if(guests.length===0){
        el.innerHTML='<div class="gs-no-results">No guests found.</div>';
        el.classList.add('active');
        return;
    }
    var html='';
    guests.forEach(function(g){
        var name=((g.first_name||'')+' '+(g.last_name||'')).trim()||'Guest #'+g.id;
        var detail=g.phone||g.email||'';
        var lastVisit=g.last_visit?'Last: '+g.last_visit:'';
        html+='<div class="gs-result" onclick="window._selectGuestResult('+g.id+')">';
        html+='<span class="gsr-name">'+escapeHtml(name)+'</span>';
        html+='<span class="gsr-detail">'+escapeHtml(detail)+(lastVisit?' · '+lastVisit:'')+'</span>';
        html+='<span class="gsr-action">'+(g.booking_count||0)+' bookings</span>';
        html+='</div>';
    });
    el.innerHTML=html;
    el.classList.add('active');
}
window._selectGuestResult=function(guestId){
    // Switch to list view, search will close
    setViewMode('list');
    document.getElementById('gs-input').value='';
    document.getElementById('gs-wrap').classList.add('collapsed');
    document.getElementById('gs-results').classList.remove('active');
    // Try to find a booking for this guest in current data
    for(var i=0;i<state.bookings.length;i++){
        if(parseInt(state.bookings[i].guest_id,10)===guestId){
            selectBooking(parseInt(state.bookings[i].id,10));
            return;
        }
    }
    showError('Guest found — change date to their booking date.');
};

/* ---- Ticket ---- */
function getRoomCharges(){
    var groups={};
    state.roomNights.forEach(function(n){
        var key=n.booking_room_id;
        if(!groups[key]) groups[key]={name:n.room_name||n.room_code,nights:0,roomTotal:0,taxTotal:0};
        groups[key].nights+=1;
        groups[key].roomTotal+=(parseFloat(n.room_rate_amount)||0);
        groups[key].taxTotal+=(parseFloat(n.tourist_tax_amount)||0);
    });
    var charges=[];
    Object.keys(groups).forEach(function(key){
        var g=groups[key];
        charges.push({name:g.name+' ('+g.nights+'n)',amount:g.roomTotal,type:'room',key:key});
        if(g.taxTotal>0) charges.push({name:g.name+' Taxe de s\u00E9jour',amount:g.taxTotal,type:'tax',key:key});
    });
    return charges;
}

function renderTicket(){
    if(!state.activeBookingId){
        document.getElementById('ticket-panel').style.display='none';
        return;
    }
    document.getElementById('ticket-panel').style.display='';
    var b=state.activeBooking;
    var name=b?((b.first_name||'')+' '+(b.last_name||'')).trim():'#'+state.activeBookingId;
    setText('ticket-heading',name+' — '+(state.bookingRooms.map(function(r){return r.room_code}).join(', ')||'No room'));

    var editBtn=document.getElementById('ticket-edit-btn');
    editBtn.style.display='inline-block';

    var roomSel=document.getElementById('room-selector');
    if(state.bookingRooms.length>1){
        roomSel.style.display='flex';
        roomSel.innerHTML='<span>Room:</span><select id="room-select">'+
            '<option value="0">All rooms</option>'+
            state.bookingRooms.map(function(r){
                var sel=r.booking_room_id===state.activeRoomId?' selected':'';
                return '<option value="'+r.booking_room_id+'"'+sel+'>'+(r.room_name||r.room_code)+'</option>';
            }).join('')+
            '</select>';
        document.getElementById('room-select').addEventListener('change',function(e){
            selectRoom(parseInt(e.target.value,10));
        });
    }else{
        roomSel.style.display='none';
    }

    var itemsDiv=document.getElementById('ticket-items');
    var rows=[];

    var roomCharges=getRoomCharges();
    roomCharges.forEach(function(c){
        rows.push(el('div',{className:'ticket-item ti-room'},[
            el('span',{className:'ti-name'},[c.name]),
            el('span',{className:'ti-qty'},['']),
            el('span',{className:'ti-total'},[c.amount.toFixed(2)+'\u20AC']),
            el('span',{className:'ti-remove'},['']),
        ]));
    });

    if(state.ticketItems.length>0||roomCharges.length>0){
        if(roomCharges.length>0&&state.ticketItems.length>0){
            rows.push(el('div',{className:'ticket-item ti-sep'},[
                el('span',{className:'ti-name'},['— Items —']),
                el('span',{className:'ti-qty'},['']),
                el('span',{className:'ti-total'},['']),
                el('span',{className:'ti-remove'},['']),
            ]));
        }
        state.ticketItems.forEach(function(item,idx){
            rows.push(el('div',{className:'ticket-item',onClick:function(){incrementItem(idx);}},[
                el('span',{className:'ti-name'},[item.name]),
                el('span',{className:'ti-qty'},['\u00D7'+item.qty]),
                el('span',{className:'ti-total'},[(item.qty*item.price).toFixed(2)+'\u20AC']),
                el('button',{className:'ti-remove',type:'button',title:'Remove',
                    onClick:function(e){e.stopPropagation();removeItem(idx);}
                },['\u00D7']),
            ]));
        });
        itemsDiv.innerHTML='';
        rows.forEach(function(r){itemsDiv.appendChild(r);});
    }else{
        itemsDiv.innerHTML='<div class="ticket-empty">Click catalog items to add.</div>';
    }

    var roomTotal=roomCharges.reduce(function(s,c){return s+c.amount;},0);
    var itemTotal=state.ticketItems.reduce(function(s,item){return s+item.qty*item.price;},0);
    setText('ticket-total','Total: '+(roomTotal+itemTotal).toFixed(2)+'\u20AC');

    var recBtn=document.getElementById('receipt-ticket');
    recBtn.style.display=(b&&(b.payment_status==='paid'||b.payment_status==='completed'))?'':'none';
    var hRecBtn=document.getElementById('ticket-receipt-btn');
    if(hRecBtn) hRecBtn.style.display=(b&&(b.payment_status==='paid'||b.payment_status==='completed'))?'':'none';
}

/* ---- Interactions ---- */
function selectBooking(bid){
    if(state.activeBookingId===bid) return;
    state.activeBookingId=bid;
    state.activeRoomId=0;
    state.activeBooking=null;
    state.ticketItems=[];
    for(var i=0;i<state.bookings.length;i++){
        if(parseInt(state.bookings[i].id,10)===bid){
            state.activeBooking=state.bookings[i];
            break;
        }
    }
    var rooms=state.roomsByBooking[bid]||[];
    if(rooms.length===1) state.activeRoomId=rooms[0].booking_room_id;
    fetchData();
}
function selectRoom(rid){
    state.activeRoomId=rid;
    state.ticketItems=[];
    fetchData();
}
function addItem(item){
    if(!state.activeBookingId){showError('Select a booking first.');return;}
    var name=item.item_name,price=parseFloat(item.unit_price);
    var found=-1;
    for(var i=0;i<state.ticketItems.length;i++){if(state.ticketItems[i].name===name){found=i;break;}}
    if(found>=0){state.ticketItems[found].qty+=1;}
    else{state.tempIdCounter-=1;state.ticketItems.push({id:state.tempIdCounter,name:name,qty:1,price:price,stay_date:state.date,booking_room_id:state.activeRoomId||null});}
    _saveVersion++;
    renderTicket();
    autoSave();
}
var _saveVersion=0;
var _removedItemIds=[];
function incrementItem(idx){if(idx>=0&&idx<state.ticketItems.length){state.ticketItems[idx].qty+=1;_saveVersion++;renderTicket();autoSave();}}
function removeItem(idx){
    if(idx>=0&&idx<state.ticketItems.length){
        var item=state.ticketItems[idx];
        if(item.id>0) _removedItemIds.push(item.id);
        state.ticketItems.splice(idx,1);
        _saveVersion++;
        renderTicket();
        autoSave();
    }
}

var _saveTimer=0;
var _saving=false;
function autoSave(){
    if(_saving){clearTimeout(_saveTimer);_saveTimer=setTimeout(autoSave,800);return;}
    clearTimeout(_saveTimer);
    _saveTimer=setTimeout(function(){saveTicket().catch(function(){})},800);
}

function saveTicket(){
    if(_saving) return Promise.resolve();
    _saving=true;
    var savedVersion=_saveVersion;
    document.getElementById('ticket-error').style.display='none';
    document.getElementById('ticket-save-indicator').style.display='inline';
    return apiPost('ticket-save',{
        booking_id:state.activeBookingId,
        booking_room_id:state.activeRoomId||null,
        date:state.date,
        remove_ids:_removedItemIds,
        items:state.ticketItems.filter(function(item){
            // New items (temp negative id) or items whose stay_date matches current date
            if(!(item.id<0||item.stay_date===state.date)) return false;
            // When a specific room is selected, only include items for that room or unassigned (booking-level) items
            if(state.activeRoomId>0&&item.booking_room_id!==null&&item.booking_room_id!==state.activeRoomId) return false;
            return true;
        }).map(function(item){return {name:item.name,qty:item.qty,price:item.price,booking_room_id:item.booking_room_id||null};}),
    }).then(function(data){
        document.getElementById('ticket-save-indicator').style.display='none';
        _removedItemIds=[];
        if(savedVersion===_saveVersion){
            state.ticketItems=(data.items||[]).map(function(item){
                return {id:item.id,name:item.item_name,qty:parseInt(item.quantity,10),price:parseFloat(item.unit_price),stay_date:item.stay_date||null,booking_room_id:item.booking_room_id||null};
            });
            state.savedItems=data.items||[];
            renderTicket();
        }
        _saving=false;
    }).catch(function(err){
        document.getElementById('ticket-save-indicator').style.display='none';
        _saving=false;
        if(err.message!=='unauthorized') showError(err.message||'Save failed');
        throw err;
    });
}

/* ---- Pay ---- */
function showPayModal(){
    if(!state.activeBookingId){showError('Select a booking first.');return;}
    hidePayError();
    saveTicket().then(function(){
        var list=document.getElementById('pay-items-list');

        var roomGroups={};
        state.roomNights.forEach(function(n){
            var key=n.booking_room_id;
            if(!roomGroups[key]) roomGroups[key]={roomName:n.room_name||n.room_code,roomTotal:0,taxTotal:0,nights:0};
            roomGroups[key].roomTotal+=(parseFloat(n.room_rate_amount)||0);
            roomGroups[key].taxTotal+=(parseFloat(n.tourist_tax_amount)||0);
            roomGroups[key].nights+=1;
        });

        var charges=[];
        Object.keys(roomGroups).forEach(function(key){
            var rg=roomGroups[key];
            charges.push({id:'room-'+key,label:rg.roomName+' ('+rg.nights+' nights)',amount:rg.roomTotal,type:'room'});
            if(rg.taxTotal>0) charges.push({id:'tax-'+key,label:rg.roomName+' — Tourist tax',amount:rg.taxTotal,type:'tax'});
        });
        (state.savedItems||[]).forEach(function(item){
            var total=parseFloat(item.quantity)*parseFloat(item.unit_price);
            charges.push({id:'item-'+item.id,label:item.item_name+' \u00D7'+item.quantity,amount:total,type:'item'});
        });

        if(charges.length===0){showPayError('No charges to display.');return;}

        var rows=charges.map(function(c,idx){
            return el('div',{className:'pay-item'},[
                el('input',{type:'checkbox',id:'pay-chk-'+idx,checked:true,value:c.amount,'data-label':c.label}),
                el('label',{htmlFor:'pay-chk-'+idx},[c.label]),
                el('span',{className:'pay-amount'},[c.amount.toFixed(2)+'\u20AC']),
            ]);
        });
        list.innerHTML='';
        rows.forEach(function(r){list.appendChild(r);});
        document.getElementById('pay-custom-amount').value='';
        updatePayTotal();
        document.getElementById('pay-modal').classList.add('active');
    }).catch(function(){});
}

function updatePayTotal(){
    var custom=parseFloat(document.getElementById('pay-custom-amount').value);
    if(custom>0){
        setText('pay-total','Total: '+custom.toFixed(2)+'\u20AC (custom)');
        return;
    }
    var total=0;
    qsa('#pay-items-list input[type=checkbox]:checked').forEach(function(cb){total+=parseFloat(cb.value||0);});
    setText('pay-total','Total: '+total.toFixed(2)+'\u20AC');
}

function sendToTerminal(){
    hidePayError();
    var custom=parseFloat(document.getElementById('pay-custom-amount').value);
    var total;
    if(custom>0){
        total=custom;
    }else{
        var checkboxes=qsa('#pay-items-list input[type=checkbox]:checked');
        if(checkboxes.length===0){showPayError('Select at least one item or enter a custom amount.');return;}
        total=0;
        checkboxes.forEach(function(cb){total+=parseFloat(cb.value||0);});
    }
    if(total<=0){showPayError('Amount must be greater than 0.');return;}
    var skipReceipt=document.getElementById('pay-skip-receipt').checked;
    var btn=document.getElementById('pay-confirm');
    btn.disabled=true;
    btn.textContent='Sending to terminal…';

    apiPost('ticket-show-bill',{
        booking_id:state.activeBookingId,
        amount:total,
        skip_receipt:skipReceipt,
    }).then(function(data){
        if(!data.checkout_id){
            btn.textContent='Check terminal…';
            btn.disabled=false;
            setTimeout(function(){closePayModal();fetchData();},5000);
            return;
        }
        btn.textContent='Waiting for terminal…';
        document.getElementById('pay-ticket').style.display='none';
        return pollCheckoutStatus(data.checkout_id);
    }).then(function(data){
        if(!data) return;
        // Update local state immediately so Paid badge shows right away
        for(var i=0;i<state.bookings.length;i++){
            if(parseInt(state.bookings[i].id,10)===state.activeBookingId){
                state.bookings[i].payment_status='paid';
                break;
            }
        }
        renderBookings();
        setHTML('pay-success','Payment sent to terminal! '+total.toFixed(2)+'\u20AC'+
            ' <button class="btn-receipt" onclick="reissueReceipt('+state.activeBookingId+')" style="margin-left:8px;vertical-align:middle">🖨 Reissue</button>');
        document.getElementById('pay-success').style.display='block';
        btn.textContent='\u2713 '+(total.toFixed(2))+'€';
        clearTimeout(window._paySuccessTimer);
        window._paySuccessTimer=setTimeout(function(){closePayModal();fetchData();},2000);
    }).catch(function(err){
        if(err.message==='unauthorized') return;
        showPayError(err.message||'Failed to send payment.');
        btn.disabled=false;
        btn.textContent='Retry';
    });
}

function pollCheckoutStatus(statusId){
    return new Promise(function(resolve,reject){
        if(!statusId){reject(new Error('No ID returned from server.'));return;}
        var maxAttempts=150;
        var attempts=0;
        var btn=document.getElementById('pay-confirm');
        function poll(){
            attempts++;
            apiGet('ticket-checkout-status/'+encodeURIComponent(statusId)).then(function(data){
                if(data.status==='completed'){
                    resolve(data);
                }else if(data.status==='canceled'||data.status==='failed'){
                    reject(new Error('Payment '+data.status+' on terminal.'));
                }else{
                    if(attempts>=maxAttempts){
                        reject(new Error('Timed out waiting for terminal.'));
                    }else{
                        setTimeout(poll,2000);
                    }
                }
            }).catch(function(err){
                reject(err);
            });
        }
        poll();
    });
}

function closePayModal(){
    document.getElementById('pay-modal').classList.remove('active');
    var btn=document.getElementById('pay-confirm');
    btn.disabled=false;
    btn.textContent='Pay with Terminal';
    document.getElementById('pay-ticket').style.display='';
    hidePayError();
    document.getElementById('pay-success').style.display='none';
}

function reissueReceipt(bookingId){
    var showMsg=function(msg,isErr){
        var el=document.getElementById('pay-modal-error');
        if(!el||!document.getElementById('pay-modal').classList.contains('active')){
            el=document.getElementById('ticket-error');
        }
        if(isErr){
            el.style.background='var(--error-bg)';el.style.color='var(--red)';
        }else{
            el.style.background='var(--success-bg)';el.style.color='var(--green)';
        }
        el.textContent=msg;el.style.display='block';
        if(isErr) setTimeout(function(){el.style.display='none'},5000);
    };
    apiPost('ticket-reissue-receipt',{booking_id:bookingId}).then(function(data){
        showMsg('Receipt sent to terminal!',false);
    }).catch(function(err){
        if(err.message!=='unauthorized') showMsg(err.message||'Failed to reissue receipt.',true);
    });
}

function hidePayError(){
    var e1=document.getElementById('pay-error');if(e1)e1.style.display='none';
    var e2=document.getElementById('pay-modal-error');if(e2)e2.style.display='none';
    var s=document.getElementById('pay-success');if(s)s.style.display='none';
}
function showPayError(msg){
    var el=document.getElementById('pay-modal-error')||document.getElementById('pay-error');
    if(el){el.textContent=msg;el.style.display='block';setTimeout(function(){el.style.display='none'},5000);}
}

        id_document_number:document.getElementById('ci-id-number').value.trim(),
    };

    if(_ciPhotoData) guestData.id_photo_base64=_ciPhotoData;

    var btn=document.getElementById('ci-confirm');
    btn.disabled=true;
    btn.textContent='Checking in…';

    apiPost('ticket-checkin',{
        booking_id:_ciBookingId,
        guest:guestData,
    }).then(function(data){
        for(var i=0;i<state.bookings.length;i++){
            if(parseInt(state.bookings[i].id,10)===_ciBookingId){
                state.bookings[i].status_code='checked_in';
                break;
            }
        }
        closeCiModal();
        renderBookings();
    }).catch(function(err){
        if(err.message==='unauthorized') return;
        showCiError(err.message||'Check-in failed.');
        btn.disabled=false;
        btn.textContent='✓ Confirm Check-in';
    });
}

/* ---- Quick Booking ---- */
function openQuickBookingModal(){
    document.getElementById('qb-error').style.display='none';
    document.getElementById('qb-name').value='';
    document.getElementById('qb-phone').value='';
    document.getElementById('qb-email').value='';
    document.getElementById('qb-check-in').value=state.date;
    var d=new Date(state.date+'T12:00:00');
    d.setDate(d.getDate()+1);
    document.getElementById('qb-check-out').value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    document.getElementById('qb-adults').value='1';

    // Populate room dropdown
    var sel=document.getElementById('qb-room');
    sel.innerHTML='<option value="">Select room (optional)</option>';
    state.bookings.forEach(function(b){
        var rooms=state.roomsByBooking[b.id]||[];
        rooms.forEach(function(r){
            // Only show room if not already in dropdown
            var exists=false;
            for(var j=0;j<sel.options.length;j++){if(sel.options[j].value===String(r.room_id)){exists=true;break;}}
            if(!exists&&r.room_code){
                sel.add(new Option(r.room_code+' ('+r.room_name+')',r.room_id));
            }
        });
    });

    // If no rooms from bookings, try catalog rooms
    if(sel.options.length<=1){
        // Will load rooms from ticket-room-status endpoint
        apiGet('ticket-room-status').then(function(data){
            (data.rooms||[]).forEach(function(r){
                if(r.active){
                    var exists=false;
                    for(var j=0;j<sel.options.length;j++){if(sel.options[j].value===String(r.id)){exists=true;break;}}
                    if(!exists) sel.add(new Option(r.room_code||r.room_name,r.id));
                }
            });
        }).catch(function(){});
    }

    document.getElementById('qb-modal').classList.add('active');
}

function closeQbModal(){
    document.getElementById('qb-modal').classList.remove('active');
}

function submitQuickBooking(){
    var errEl=document.getElementById('qb-error');
    errEl.style.display='none';
    var guestName=document.getElementById('qb-name').value.trim();
    if(!guestName){errEl.textContent='Guest name is required.';errEl.style.display='block';return;}

    var checkIn=document.getElementById('qb-check-in').value;
    var checkOut=document.getElementById('qb-check-out').value;
    if(!checkIn||!checkOut||checkOut<=checkIn){errEl.textContent='Check-out must be after check-in.';errEl.style.display='block';return;}

    var btn=document.getElementById('qb-confirm');
    btn.disabled=true;
    btn.textContent='Creating…';

    apiPost('ticket-create-booking',{
        guest_name:guestName,
        phone:document.getElementById('qb-phone').value.trim(),
        email:document.getElementById('qb-email').value.trim(),
        check_in:checkIn,
        check_out:checkOut,
        room_id:parseInt(document.getElementById('qb-room').value,10)||0,
        adults:parseInt(document.getElementById('qb-adults').value,10)||1,
    }).then(function(data){
        closeQbModal();
        // Switch to the booking's date and select it
        state.date=checkIn;
        document.getElementById('ticket-date').value=checkIn;
        state.activeBookingId=0;
        state.activeBooking=null;
        state.ticketItems=[];
        state.savedItems=[];
        fetchData().then(function(){
            // Find and select the new booking
            for(var i=0;i<state.bookings.length;i++){
                if(parseInt(state.bookings[i].id,10)===data.booking_id){
                    selectBooking(data.booking_id);
                    break;
                }
            }
        });
    }).catch(function(err){
        if(err.message!=='unauthorized'){
            errEl.textContent=err.message||'Failed to create booking.';
            errEl.style.display='block';
        }
        btn.disabled=false;
        btn.textContent='✓ Create Booking';
    });
}

/* ---- Booking Edit ---- */
var _beBookingId=0;
function openEditModal(){
    if(!state.activeBookingId||!state.activeBooking) return;
    _beBookingId=state.activeBookingId;
    document.getElementById('be-error').style.display='none';
    setText('be-heading','Edit Booking #'+state.activeBookingId);

    document.getElementById('be-check-in').value=state.activeBooking.check_in_date||'';
    document.getElementById('be-check-out').value=state.activeBooking.check_out_date||'';

    var sel=document.getElementById('be-add-room');
    sel.innerHTML='<option value="">— Select room to add —</option>';
    // Load rooms from room status endpoint
    apiGet('ticket-room-status').then(function(data){
        (data.rooms||[]).forEach(function(r){
            if(!r.active) return;
            // Check if room already in booking
            var already=state.bookingRooms.some(function(br){return parseInt(br.room_id,10)===parseInt(r.id,10);});
            if(!already) sel.add(new Option(r.room_code||r.room_name,r.id));
        });
    }).catch(function(){});

    document.getElementById('be-modal').classList.add('active');
}

function closeEditModal(){
    document.getElementById('be-modal').classList.remove('active');
    _beBookingId=0;
}

function submitEditBooking(){
    var errEl=document.getElementById('be-error');
    errEl.style.display='none';

    var ci=document.getElementById('be-check-in').value;
    var co=document.getElementById('be-check-out').value;
    var addRoom=parseInt(document.getElementById('be-add-room').value,10)||0;

    if(!ci||!co||co<=ci){errEl.textContent='Invalid dates.';errEl.style.display='block';return;}

    var btn=document.getElementById('be-confirm');
    btn.disabled=true;
    btn.textContent='Saving…';

    var payload={booking_id:_beBookingId,check_in:ci,check_out:co};
    if(addRoom>0) payload.add_room_id=addRoom;

    apiPost('ticket-update-booking',payload).then(function(){
        closeEditModal();
        fetchData();
    }).catch(function(err){
        if(err.message!=='unauthorized'){
            errEl.textContent=err.message||'Failed to update.';
            errEl.style.display='block';
        }
        btn.disabled=false;
        btn.textContent='✓ Save Changes';
    });
}

/* ---- Fullscreen ---- */
function toggleFullscreen(){
    var d=document.documentElement;
    if(document.fullscreenElement||document.webkitFullscreenElement){
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }else{
        if(d.requestFullscreen) d.requestFullscreen();
        else if(d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    }
}

/* ---- Viewport ---- */
function fixViewport(){
    document.getElementById('app').style.height=window.innerHeight+'px';
}

document.addEventListener('DOMContentLoaded',function(){

        navigator.serviceWorker.register('sw.js?_v='+Date.now());
    }
    fixViewport();

    document.addEventListener('fullscreenchange',fixViewport);
    document.addEventListener('webkitfullscreenchange',fixViewport);
    document.addEventListener('click',function(e){

        hideLogin();
        setViewMode(state.viewMode);
        fetchData();
        loadDailyNote();
    }

    function reloadOnDateChange(){
        state.activeBookingId=0;state.activeRoomId=0;state.activeBooking=null;
        state.ticketItems=[];state.savedItems=[];

        loadDailyNote();
    }

        d.setDate(d.getDate()-1);
        state.date=d.toISOString().slice(0,10);
        dateInput.value=state.date;
        reloadOnDateChange();
    });

    document.getElementById('date-next').addEventListener('click',function(){
        var d=new Date(state.date+'T12:00:00');
        d.setDate(d.getDate()+1);
        state.date=d.toISOString().slice(0,10);
        dateInput.value=state.date;
        reloadOnDateChange();
    });

    // Search toggle
    document.getElementById('gs-toggle').addEventListener('click',function(){
        var wrap=document.getElementById('gs-wrap');
        var input=document.getElementById('gs-input');
        wrap.classList.toggle('collapsed');
        if(!wrap.classList.contains('collapsed')){input.focus();}
    });
    document.getElementById('gs-input').addEventListener('blur',function(){
        if(!this.value.trim()) document.getElementById('gs-wrap').classList.add('collapsed');
    });

    // View switching
    document.getElementById('hamburger').addEventListener('click',function(e){e.stopPropagation();toggleHm();});
    document.getElementById('view-refresh').addEventListener('click',function(){
        var btn=this;
        btn.classList.add('refreshing');

    document.getElementById('view-dash').addEventListener('click',function(){closeHm();setViewMode('dash');});
    document.getElementById('view-list').addEventListener('click',function(){closeHm();setViewMode('list');});
    document.getElementById('view-cal').addEventListener('click',function(){closeHm();setViewMode('cal');});
    document.getElementById('view-maint').addEventListener('click',function(){closeHm();setViewMode('maint');});
    document.getElementById('view-fin').addEventListener('click',function(){closeHm();setViewMode('fin');});
    document.getElementById('view-pricing').addEventListener('click',function(){closeHm();setViewMode('pricing');});
    document.getElementById('hm-view-dash').addEventListener('click',function(){closeHm();setViewMode('dash');});
    document.getElementById('hm-view-list').addEventListener('click',function(){closeHm();setViewMode('list');});
    document.getElementById('hm-view-cal').addEventListener('click',function(){closeHm();setViewMode('cal');});
    document.getElementById('hm-view-maint').addEventListener('click',function(){closeHm();setViewMode('maint');});
    document.getElementById('hm-view-fin').addEventListener('click',function(){closeHm();setViewMode('fin');});

    document.getElementById('hm-view-refresh').addEventListener('click',function(){closeHm();var btn=document.getElementById('view-refresh');btn.classList.add('refreshing');fetchData().then(function(){btn.classList.remove('refreshing');}).catch(function(){btn.classList.remove('refreshing');});});

    qsa('.pricing-tab').forEach(function(tab){

        var file=e.target.files&&e.target.files[0];
        if(!file) return;
        document.getElementById('ci-photo-name').textContent=file.name;
        var reader=new FileReader();
        reader.onload=function(ev){
            var img=new Image();
            img.onload=function(){
                var maxW=1024,maxH=768;
                var w=img.width,h=img.height;
                if(w>maxW){h=h*maxW/w;w=maxW;}
                if(h>maxH){w=w*maxH/h;h=maxH;}
                var c=document.createElement('canvas');
                c.width=w;c.height=h;
                var ctx=c.getContext('2d');
                ctx.drawImage(img,0,0,w,h);
                _ciPhotoData=c.toDataURL('image/jpeg',0.7);
            };
            img.src=ev.target.result;
        };
        reader.readAsDataURL(file);
    });
