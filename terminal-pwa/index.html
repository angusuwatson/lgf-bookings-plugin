<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LGF Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-152.png" type="image/png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>LGF Dashboard</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f97316;--hover-bg:rgba(59,130,246,.15);--error-bg:rgba(239,68,68,.15);--success-bg:rgba(34,197,94,.15)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:18px;color:var(--text);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit;font-size:16px}
/* Login */
#login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:2000;display:flex;justify-content:center;align-items:center}
.login-box{background:var(--card);border-radius:16px;padding:32px;width:90%;max-width:420px;text-align:center}
.login-box h2{font-size:24px;color:var(--text);margin-bottom:8px}
.login-box p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.4}
.login-box input{width:100%;padding:14px;border:2px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:12px;outline:none;transition:border-color .15s;background:var(--bg);color:var(--text)}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;margin-top:4px;touch-action:manipulation}
.login-box button:active{background:#2563eb}
.login-box button:disabled{opacity:.5}
.login-box .login-hint{font-size:12px;color:var(--muted);margin-top:8px}
#login-error{color:var(--red);font-size:14px;margin-top:12px;padding:8px 12px;background:var(--error-bg);border-radius:8px;display:none;word-break:break-word}
/* Header */
.header{background:var(--bg);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;position:relative;z-index:100}
.header h1{font-size:18px;font-weight:700;flex-shrink:0;margin-right:4px}
.header input[type=date]{font-size:15px;padding:6px 10px;border-radius:8px;border:none;background:var(--card);color:var(--text);min-height:36px}
.header .user-name{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.header .fs-btn{font-size:18px;background:none;border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 8px;line-height:1;flex-shrink:0}
.header .fs-btn:active{border-color:#fff;background:rgba(255,255,255,.15)}
.view-btn{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;min-height:32px;flex-shrink:0}
.view-btn.active{border-color:#fff;color:#fff;background:rgba(255,255,255,.15)}
.view-btn:active{background:rgba(255,255,255,.2)}
@keyframes spin{to{transform:rotate(360deg)}}
#view-refresh.refreshing{animation:spin .6s linear}
.gs-input{font-size:14px;padding:6px 10px;border-radius:8px;border:none;background:rgba(255,255,255,.15);color:#fff;min-height:32px;flex:1;min-width:80px;max-width:200px;outline:none}
.gs-input::placeholder{color:rgba(255,255,255,.5)}
.gs-input:focus{background:rgba(255,255,255,.25)}
.gs-wrap{display:flex;align-items:center;gap:4px;flex:1;max-width:200px;position:relative;transition:flex .2s,max-width .2s}
.gs-toggle{background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1;min-height:32px}
.gs-toggle:active{color:#fff}
.gs-wrap .gs-input{flex:1;min-width:0;max-width:none;transition:width .2s,opacity .2s,padding .2s}
.gs-wrap.collapsed{flex:0;max-width:32px}
.gs-wrap.collapsed .gs-input{width:0;padding:6px 0;opacity:0;overflow:hidden;flex:0;border:none}
.gs-wrap.collapsed .gs-input::placeholder{color:transparent}
.btn-qb-hdr{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:2px 10px;font-size:22px;font-weight:700;line-height:1;min-height:32px;flex-shrink:0}
.btn-qb-hdr:active{background:rgba(255,255,255,.3)}
/* Search results */
.gs-results{position:absolute;top:100%;left:0;right:0;background:var(--card);border-radius:0 0 12px 12px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:500;max-height:50vh;overflow-y:auto;display:none}
.gs-results.active{display:block}
.gs-result{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px}
.gs-result:active{background:var(--hover-bg)}
.gs-result:last-child{border-bottom:none}
.gs-result .gsr-name{font-weight:600;font-size:15px;white-space:nowrap}
.gs-result .gsr-detail{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-result .gsr-action{font-size:11px;color:var(--accent);font-weight:600;flex-shrink:0}
.gs-no-results{padding:16px;text-align:center;color:var(--muted);font-size:14px}
/* Bookings row */
.bookings-row{display:flex;gap:8px;padding:10px;overflow-x:auto;flex-shrink:0;background:var(--card);border-bottom:2px solid var(--border);min-height:70px;-webkit-overflow-scrolling:touch}
.booking-card{flex:0 0 auto;padding:10px 14px;border-radius:10px;border:2px solid var(--border);background:var(--card);cursor:pointer;text-align:left;min-width:160px;transition:border-color .1s}
.booking-card:active,.booking-card-active{border-color:var(--accent);background:var(--hover-bg)}
.booking-card-active{border-width:3px}
.btn-ci{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:14px;font-weight:600;min-height:36px}
.btn-ci:active{background:#2563eb}
.btn-co{background:var(--orange);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:14px;font-weight:600;min-height:36px}
.btn-co:active{background:#ea580c}
.booking-name{font-weight:700;font-size:15px;white-space:nowrap;color:#94a3b8}
.badge-paid{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:#16a34a;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;line-height:16px}
.booking-meta{font-size:12px;color:var(--muted);margin-top:2px}
.booking-room{font-size:11px;color:var(--muted);margin-top:2px}
/* Catalog */
.catalog-scroll{flex:1;overflow-y:auto;padding:10px;background:var(--card);-webkit-overflow-scrolling:touch}
.cat-header{margin:10px 0 6px;font-size:16px;font-weight:700;color:var(--text);cursor:pointer;-webkit-user-select:none;user-select:none;padding:4px 0}
.cat-header:first-child{margin-top:0}
.cat-arrow{display:inline-block;width:16px}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:4px}
.item-card{border:2px solid var(--border);border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;background:var(--card);transition:background .08s,border-color .08s;min-height:60px}
.item-card:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.item-name{font-size:14px;font-weight:600;word-break:break-word}
.item-price{font-size:13px;color:var(--muted);margin-top:4px}
.item-card:active .item-price{color:rgba(255,255,255,.7)}
/* Calendar */
.cal-scroll{flex:1;overflow:auto;padding:6px 6px 0;background:var(--card);-webkit-overflow-scrolling:touch}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:6px 0;background:var(--card)}
.cal-nav button{background:var(--card);border:1px solid var(--border);color:var(--fg);font-size:18px;cursor:pointer;padding:4px 12px;border-radius:4px}
.cal-nav span{font-weight:700;font-size:14px}
.cal-grid{display:table;border-collapse:collapse;width:100%;min-width:600px;font-size:13px}
.cal-row{display:table-row}
.cal-room-col{display:table-cell;padding:4px 6px;border:1px solid var(--border);font-weight:700;font-size:11px;white-space:nowrap;min-width:65px;text-align:center;vertical-align:middle}
.cal-date-col{display:table-cell;padding:3px 4px;border:1px solid var(--border);text-align:center;font-size:11px;font-weight:600;color:var(--muted);min-width:100px;vertical-align:middle}
.cal-cell{display:table-cell;padding:3px 4px;border:1px solid var(--border);text-align:center;font-size:11px;cursor:pointer;vertical-align:middle;transition:background .15s}
.cal-cell:active{opacity:.7}
.cal-free{background:transparent;color:#fff}
.cal-occ-confirmed{background:transparent;color:#64748b}
.cal-occ-checked_in{background:transparent;color:#000}
.cal-today{font-weight:700;border-color:var(--accent)!important}
.cal-guest-name{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cal-occ-line{font-size:10px;display:block;color:#000;opacity:.9;text-align:right}
.cal-bottom-line{display:flex;justify-content:space-between;font-size:10px;color:#000;opacity:.6;align-items:flex-end}
.cal-price{text-align:right;font-weight:700;color:#000;opacity:.95}
.cal-extras-price{font-size:9px;opacity:.6;text-align:right}
.cal-channel{display:inline-block;font-size:9px;font-weight:700;background:rgba(0,0,0,.15);border-radius:3px;padding:0 4px;margin-left:2px;line-height:14px}
/* Dashboard */
.dash-scroll{flex:1;overflow-y:auto;padding:12px;background:var(--card);-webkit-overflow-scrolling:touch}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:12px}
.dash-card{border:1px solid var(--border);border-radius:12px;background:var(--bg);overflow:hidden}
.dash-card-header{padding:10px 14px;font-size:14px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);background:var(--card)}
.dash-card-body{padding:10px 14px}
/* Stats row */
.dash-stats{display:flex;gap:8px;margin-bottom:12px}
.dash-stat{flex:1;border-radius:10px;padding:12px 8px;text-align:center}
.dash-stat-arr{background:rgba(59,130,246,.2);color:#60a5fa}
.dash-stat-dep{background:rgba(249,115,22,.2);color:#fb923c}
.dash-stat-room{background:rgba(34,197,94,.2);color:#4ade80}
.dash-stat-num{font-size:26px;font-weight:800;line-height:1}
.dash-stat-label{font-size:10px;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
/* Guest rows in arrivals/departures */
.dash-guest-list{max-height:220px;overflow-y:auto}
.dash-guest{border-radius:8px;border:1px solid var(--border);padding:8px 10px;margin-bottom:4px;display:flex;align-items:center;gap:8px;cursor:pointer;min-height:40px;background:var(--card)}
.dash-guest:active{background:var(--hover-bg)}
.dash-guest-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;min-width:0}
.dash-guest-meta{font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-guest-room{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}
.dash-empty{padding:16px 0;text-align:center;color:var(--muted);font-size:13px}
/* Occupancy grid (Next 7 Days) */
.dash-occ-table{display:table;width:100%;border-collapse:collapse;font-size:10px;overflow-x:auto}
.dash-occ-row{display:table-row}
.dash-occ-room{display:table-cell;padding:2px 4px;border:1px solid var(--border);font-weight:700;font-size:9px;white-space:nowrap;text-align:center;vertical-align:middle;background:var(--card);width:40px}
.dash-occ-date{display:table-cell;padding:2px 2px;border:1px solid var(--border);text-align:center;font-size:9px;min-width:36px;vertical-align:middle;color:var(--muted);background:var(--card)}
.dash-occ-cell{display:table-cell;padding:2px 2px;border:1px solid var(--border);text-align:center;font-size:9px;vertical-align:middle;transition:background .15s}
.dash-occ-free{background:transparent;color:var(--muted)}
.dash-occ-confirmed{background:rgba(59,130,246,.2);color:#60a5fa}
.dash-occ-checked_in{background:rgba(34,197,94,.2);color:#4ade80}
.dash-occ-today{border-color:var(--accent)!important}
/* Bread Order table */
.dash-bread-table{display:table;width:100%;border-collapse:collapse;font-size:12px}
.dash-bread-row{display:table-row}
.dash-bread-date{display:table-cell;padding:4px 8px;border:1px solid var(--border);white-space:nowrap;font-weight:600}
.dash-bread-cell{display:table-cell;padding:4px 8px;border:1px solid var(--border);text-align:center}
.dash-bread-header{display:table-cell;padding:4px 8px;border:1px solid var(--border);font-weight:700;font-size:11px;text-align:center;background:var(--card);color:var(--muted)}
/* Notes */
.dash-notes-table{display:table;width:100%;border-collapse:collapse;font-size:12px}
.dash-notes-row{display:table-row}
.dash-notes-date{display:table-cell;padding:4px 8px;border:1px solid var(--border);white-space:nowrap;font-weight:600;color:var(--muted)}
.dash-notes-text{display:table-cell;padding:4px 8px;border:1px solid var(--border);color:var(--text)}
.dash-notes-empty{padding:16px 0;text-align:center;color:var(--muted);font-size:13px}
.dash-card-footer{padding:10px 14px;border-top:1px solid var(--border)}
/* Bread scroll (matching standalone dashboard) */
.bread-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.bread-scroll::-webkit-scrollbar{height:4px}
.bread-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.bread-day{flex:0 0 150px;scroll-snap-align:start;background:rgba(0,0,0,.2);border-radius:8px;padding:8px 10px}
.bread-day.today{border:2px solid var(--accent)}
.bd-date{font-weight:600;font-size:13px;margin-bottom:4px}
.bd-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px solid var(--border)}
.bd-empty{color:var(--muted);font-size:12px;font-style:italic}
.bd-scroll-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
/* Status labels */
.dash-label{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;line-height:1.4;flex-shrink:0;text-align:center;min-width:32px}
.label-in{background:rgba(34,197,94,.2);color:#4ade80}
.label-out{background:rgba(249,115,22,.2);color:#fb923c}
.label-stay{background:rgba(59,130,246,.2);color:#60a5fa}
/* Source channel badge */
.ch-badge{font-size:9px;background:rgba(255,255,255,.1);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted);white-space:nowrap;flex-shrink:0}
/* Maintenance */
.maint-scroll{flex:1;overflow-y:auto;padding:10px;background:var(--card);-webkit-overflow-scrolling:touch}
.mt-input-row{display:flex;gap:8px;margin-bottom:12px}
.mt-input-row input{flex:1;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:15px;outline:none;min-height:44px;background:var(--bg);color:var(--text)}
.mt-input-row input:focus{border-color:var(--accent)}
.mt-input-row button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;min-height:44px}
.mt-input-row button:active{background:#2563eb}
.mt-item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.mt-item .mt-done{width:22px;height:22px;flex-shrink:0;cursor:pointer}
.mt-item .mt-text{flex:1;font-size:14px;line-height:1.3}
.mt-item .mt-text.done{text-decoration:line-through;color:var(--muted)}
.mt-item .mt-date{font-size:11px;color:var(--muted);flex-shrink:0}
.mt-item .mt-del{background:none;border:none;font-size:18px;color:var(--red);cursor:pointer;padding:4px;line-height:1;flex-shrink:0}
.mt-empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
/* Finances */
.fin-scroll{flex:1;overflow-y:auto;padding:10px;background:var(--card);-webkit-overflow-scrolling:touch}
.fin-nav{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-shrink:0}
.fin-nav button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 16px;font-size:18px;font-weight:700;min-height:40px;min-width:44px}
.fin-nav button:active{background:#2563eb}
.fin-nav span{font-size:16px;font-weight:700;color:var(--text);flex:1;text-align:center}
.fin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.fin-card{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--bg)}
.fin-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.fin-card-amount{font-size:22px;font-weight:800;color:var(--text)}
.fin-card-amount.green{color:var(--green)}
.fin-card-amount.orange{color:var(--orange)}
.fin-card-amount.blue{color:#60a5fa}
.fin-card-amount.pink{color:#f472b6}
.fin-card-sub{font-size:11px;color:var(--muted);margin-top:2px}
.fin-section-title{font-size:14px;font-weight:700;color:var(--text);margin:14px 0 8px}
.fin-table{width:100%;border-collapse:collapse;font-size:13px}
.fin-table th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
.fin-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.fin-table tr:last-child td{border-bottom:none}
.fin-table .num{text-align:right;font-variant-numeric:tabular-nums}
.fin-table .tot{font-weight:700;color:var(--text)}
.fin-change-up{color:var(--green)}
.fin-change-down{color:var(--red)}
.fin-row-label{font-size:13px;color:var(--muted);margin-bottom:2px}
.fin-row-amount{font-size:20px;font-weight:800}
.fin-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:8px;font-size:13px}
.fin-breakdown .bd-item{display:flex;justify-content:space-between}
.fin-breakdown .bd-label{color:var(--muted)}
.fin-breakdown .bd-val{font-weight:600}
/* Main layout */
.main{display:flex;flex:1;min-height:0}
.left-panel{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
/* Hamburger */
.hamburger{display:none;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 10px;font-size:18px;line-height:1;min-height:32px;cursor:pointer;flex-shrink:0}
.hamburger:active{background:rgba(255,255,255,.2)}
.hm-menu{display:none;position:absolute;top:100%;right:8px;background:var(--bg);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px;z-index:600;flex-direction:column;gap:4px;min-width:180px}
.hm-menu.active{display:flex}
.hm-menu .view-btn{display:block;width:100%;text-align:left;padding:8px 14px;font-size:14px}
.hm-menu .hm-search{display:block;width:100%;padding:8px 14px;font-size:14px;background:rgba(255,255,255,.1);border:none;border-radius:6px;color:#fff;outline:none}
.hm-menu .hm-search::placeholder{color:rgba(255,255,255,.4)}
.hm-menu .hm-user{display:block;padding:6px 14px;font-size:12px;color:rgba(255,255,255,.5);text-align:center;border-top:1px solid rgba(255,255,255,.1);margin-top:4px}
.hm-menu .hm-logout{display:block;width:100%;padding:8px 14px;font-size:13px;background:none;border:none;color:#e57373;border-radius:6px;cursor:pointer;text-align:center}
.hm-menu .hm-logout:active{background:rgba(255,255,255,.1)}
/* Responsive */
@media(max-width:768px){
  .main{flex-direction:column}
  .left-panel{flex:1;min-height:0}
  .ticket-panel{width:100%;border-left:none;border-top:2px solid var(--border);flex:0 0 auto;max-height:50vh}
  .hamburger{display:inline-flex}
  .header > .view-btn{display:none}
  .header > .view-btn{display:none}
  .header .gs-wrap{display:none}
  .header .user-name{display:none}
  .header #logout-btn{display:none}
}
/* Ticket panel */
.ticket-panel{width:380px;flex-shrink:0;display:flex;flex-direction:column;background:var(--card);overflow:hidden;border-left:2px solid var(--border)}
.ticket-header{display:flex;align-items:center;gap:6px;padding:12px 14px;font-weight:700;font-size:15px;border-bottom:2px solid var(--border);background:var(--card);flex-shrink:0;flex-wrap:wrap}
.ticket-header #ticket-heading{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket-header .th-edit{background:none;border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;min-height:32px;color:var(--muted)}
.ticket-header .th-edit:active{background:var(--hover-bg)}
.ticket-header .th-receipt{background:none;border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:14px;min-height:32px;color:var(--muted);cursor:pointer;line-height:1}
.ticket-header .th-receipt:active{background:var(--hover-bg)}
.th-close{background:none;border:none;font-size:28px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
.th-close:active{color:var(--text)}
.ticket-items{flex:1;overflow-y:auto;padding:6px 10px;min-height:0;-webkit-overflow-scrolling:touch}
.ticket-empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
.ticket-item{display:flex;align-items:center;gap:6px;padding:8px;border-radius:8px;cursor:pointer;min-height:40px}
.ticket-item:active{background:rgba(255,255,255,.05)}
.ti-name{flex:1;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-qty{font-size:13px;color:var(--muted);min-width:28px;text-align:center}
.ti-total{font-size:13px;font-weight:600;min-width:55px;text-align:right}
.ti-remove{background:none;border:none;font-size:20px;color:var(--red);cursor:pointer;padding:4px 6px;line-height:1}
.ti-room{background:rgba(59,130,246,.1);border-radius:8px;margin:2px 0;pointer-events:none}
.ti-room .ti-name{font-weight:600}
.ti-sep{pointer-events:none;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);padding:3px 8px;margin:3px 0}
/* Ticket footer */
.ticket-footer{flex-shrink:0;padding:10px 14px;border-top:2px solid var(--border);background:var(--card)}
.ticket-total{font-size:18px;font-weight:700;margin-bottom:8px}
.ticket-actions{display:flex;gap:6px}
.ticket-actions button{flex:1;padding:12px;border-radius:10px;border:none;font-size:15px;font-weight:700;min-height:44px}
.btn-save{background:var(--accent);color:#fff}
.btn-save:active{background:#2563eb}
.btn-pay{background:var(--green);color:#fff}
.btn-pay:active{background:#16a34a}
.btn-receipt{background:var(--card);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-receipt:active{background:var(--hover-bg)}
.btn-receipt-sm{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;line-height:1;color:var(--muted)}
.btn-receipt-sm:active{color:var(--text)}
/* Error / success */
#ticket-error,#pay-error{background:var(--error-bg);color:var(--red);padding:8px 14px;border-radius:8px;margin:6px 10px;display:none;font-size:13px}
#pay-success{background:var(--success-bg);color:var(--green);padding:8px 14px;border-radius:8px;margin:6px 10px;display:none;font-size:13px}
#ticket-save-indicator{display:none;font-size:12px;color:var(--muted)}
/* Pay modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal-box{background:var(--card);border-radius:16px;padding:24px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;position:relative}
.modal-box h2{font-size:20px;margin-bottom:16px}
.modal-close{background:none;border:none;font-size:28px;color:var(--muted);cursor:pointer;position:absolute;top:12px;right:16px;line-height:1;padding:4px 8px}
.modal-close:active{color:var(--text)}
.pay-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.pay-item input[type=checkbox]{width:20px;height:20px}
.pay-item label{flex:1;font-size:15px}
.pay-amount{font-weight:600;font-size:15px;white-space:nowrap}
.pay-custom-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px;color:var(--muted)}
.pay-custom-row input{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;max-width:160px}
.pay-total{font-size:20px;font-weight:700;margin:14px 0;text-align:right}
.pay-actions{display:flex;gap:10px}
.pay-actions button{flex:1;padding:14px;border-radius:10px;border:none;font-size:16px;font-weight:700;min-height:48px}
.btn-pay-confirm{background:var(--green);color:#fff}
.btn-pay-confirm:disabled{opacity:.5}
.btn-pay-cancel{background:var(--border);color:var(--text)}
#pay-modal-error{background:var(--error-bg);color:var(--red);padding:10px 16px;border-radius:8px;margin:8px 0;display:none;font-size:14px}
.ci-section{padding:8px 0;border-bottom:1px solid var(--border)}
.ci-section:last-child{border-bottom:none}
.ci-label{font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.ci-row{display:flex;gap:8px;margin-bottom:6px}
.ci-row input,.ci-row select,.ci-row textarea{flex:1;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:15px;outline:none;min-height:44px;background:var(--bg);color:var(--text)}
.ci-row input:focus,.ci-row select:focus{border-color:var(--accent)}
.ci-row textarea{min-height:60px;resize:vertical}
.btn-ci-photo{background:var(--card);border:2px solid var(--border);border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;flex-shrink:0}
.btn-ci-photo:active{background:var(--hover-bg)}
/* Booking edit modal */
.bedit-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.bedit-row label{font-size:13px;color:var(--muted);min-width:60px}
.bedit-row input,.bedit-row select{flex:1;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:15px;outline:none;min-height:44px;background:var(--bg);color:var(--text)}
.bedit-row input:focus,.bedit-row select:focus{border-color:var(--accent)}
/* Room selector */
.room-selector{padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:13px;border-bottom:1px solid var(--border);background:var(--card)}
.room-selector select{padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:13px;min-height:36px;background:var(--bg);color:var(--text)}
/* misc */
.dn-bar{border-bottom:1px solid var(--border);padding:6px 12px;background:var(--card);flex-shrink:0}
.dn-bar>div:first-child{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dn-label{font-size:13px;font-weight:700;color:var(--muted)}
.dn-saved{font-size:11px;color:var(--green);display:none}
.dash-date{font-size:14px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-height:28px}
.date-nav-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 8px;min-height:28px;line-height:1}
.date-nav-btn:active{background:var(--hover-bg)}
#dn-input{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--bg);color:var(--text)}
.text-muted{color:var(--muted)}
.text-sm{font-size:12px}
.hidden{display:none!important}
/* Pricing */
.pricing-scroll{flex:1;overflow-y:auto;padding:10px;background:var(--card);-webkit-overflow-scrolling:touch}
.pricing-nav{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-shrink:0}
.pricing-nav button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 16px;font-size:18px;font-weight:700;min-height:40px;min-width:44px}
.pricing-nav button:active{background:#2563eb}
.pricing-nav span{font-size:16px;font-weight:700;color:var(--text);flex:1;text-align:center}
.pricing-tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto}
.pricing-tab{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.pricing-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pricing-tab:active{opacity:.8}
.pricing-cal{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
.pricing-cal th{padding:4px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border);text-align:center}
.pricing-cal th.room-col{text-align:left;min-width:80px}
.pricing-cal td{padding:4px 6px;border-bottom:1px solid var(--border);text-align:center;font-variant-numeric:tabular-nums}
.pricing-cal td.room-cell{text-align:left;font-weight:700;font-size:13px;white-space:nowrap}
.pricing-cal td.weekend{background:rgba(245,158,11,.06)}
.pricing-cal td.has-actual{font-weight:700;color:var(--green)}
.pricing-cal td.no-rule{color:var(--muted);opacity:.5}
.pricing-cal td.suggested{color:var(--text)}
.pricing-cal tr.pricing-room-header td{background:rgba(0,0,0,.04);font-weight:700;font-size:13px;padding:6px;border-bottom:1px solid var(--border)}
.pricing-season-card,.pricing-event-card,.pricing-rule-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
.pricing-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pricing-card-title{font-size:14px;font-weight:700;color:var(--text)}
.pricing-card-dates{font-size:11px;color:var(--muted)}
.pricing-card-body{font-size:12px;color:var(--muted);line-height:1.4}
.pricing-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase}
.pricing-badge.high{background:#dc2626;color:#fff}
.pricing-badge.medium{background:#f59e0b;color:#000}
.pricing-badge.low{background:#22c55e;color:#fff}
.pricing-add-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:12px}
.pricing-add-btn:active{background:#2563eb}
.pricing-empty{text-align:center;color:var(--muted);padding:30px 0;font-size:13px}
.pricing-form{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--bg)}
.pricing-form label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;margin-top:10px}
.pricing-form input,.pricing-form select,.pricing-form textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--card);color:var(--text);box-sizing:border-box}
.pricing-form textarea{min-height:60px;resize:vertical}
.pricing-form .form-row{display:flex;gap:10px}
.pricing-form .form-row>div{flex:1}
.pricing-form-actions{display:flex;gap:8px;margin-top:14px}
.pricing-form-actions button{flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.pricing-btn-save{background:var(--accent);color:#fff}
.pricing-btn-cancel{background:var(--border);color:var(--text)}
.pricing-btn-del{background:var(--red);color:#fff}
.pricing-audit-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
.pricing-audit-row:last-child{border-bottom:none}
.pricing-audit-room{font-weight:700;min-width:50px}
.pricing-audit-date{color:var(--muted);min-width:80px}
.pricing-audit-prices{flex:1}
.pricing-audit-old{color:var(--red);text-decoration:line-through}
.pricing-audit-new{color:var(--green);font-weight:700}
.pricing-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--muted)}
.pricing-legend-item{display:flex;align-items:center;gap:4px}
.pricing-legend-dot{width:10px;height:10px;border-radius:2px}
.pricing-cal td{cursor:pointer}
.pricing-cal td:hover{outline:2px solid var(--accent);outline-offset:-2px}
.pp-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:900;display:flex;align-items:center;justify-content:center}
.pp-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;width:300px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.pp-box h3{margin:0 0 10px;font-size:15px;color:var(--text)}
.pp-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.pp-row:last-child{border-bottom:none}
.pp-label{color:var(--muted)}
.pp-val{font-weight:700;font-variant-numeric:tabular-nums}
.pp-val.suggested{color:var(--accent)}
.pp-val.actual{color:var(--green)}
.pp-custom{display:flex;gap:8px;align-items:center;margin:10px 0}
.pp-custom label{font-size:12px;color:var(--muted);white-space:nowrap}
.pp-custom input{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);width:80px}
.pp-actions{display:flex;gap:8px;margin-top:12px}
.pp-actions button{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.pp-apply{background:var(--accent);color:#fff}
.pp-apply:active{background:#2563eb}
.pp-close{background:var(--border);color:var(--text)}
.pp-bulk{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pp-bulk-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer}
.pp-bulk-btn:active{background:#2563eb}
.pp-bulk-btn.secondary{background:var(--border);color:var(--text)}
.pp-bulk-count{font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>LGF</h1>
    <div class="gs-wrap collapsed" id="gs-wrap">
      <button class="gs-toggle" id="gs-toggle">🔍</button>
      <input type="search" id="gs-input" placeholder="Search" class="gs-input" autocomplete="off">
    </div>
    <button class="view-btn active" data-view="dash" id="view-dash">Dash</button>
    <button class="view-btn" data-view="list" id="view-list">Tickets</button>
    <button class="view-btn" data-view="cal" id="view-cal">Cal</button>
    <button class="view-btn" data-view="fin" id="view-fin">Fin</button>
    <button class="view-btn" data-view="pricing" id="view-pricing">💰</button>
    <button class="view-btn" data-view="maint" id="view-maint">Maint</button>
    <button class="view-btn" id="view-refresh" title="Refresh data">↻</button>
    <button class="hamburger" id="hamburger">☰</button>
    <button class="btn-qb-hdr" id="qb-open" title="Quick booking">+</button>
    <span class="user-name" id="user-label"></span>
    <button class="fs-btn" id="fs-btn" title="Toggle fullscreen">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
    <button id="logout-btn" style="background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 8px;font-size:11px;min-height:32px">Logout</button>
    <div class="hm-menu" id="hm-menu">
      <input type="search" id="hm-search" placeholder="Search" class="hm-search" autocomplete="off">
      <button class="view-btn active" data-view="dash" id="hm-view-dash">📊 Dash</button>
      <button class="view-btn" data-view="list" id="hm-view-list">📋 Tickets</button>
      <button class="view-btn" data-view="cal" id="hm-view-cal">📅 Calendar</button>
      <button class="view-btn" data-view="fin" id="hm-view-fin">💰 Fin</button>
      <button class="view-btn" data-view="pricing" id="hm-view-pricing">💲 Pricing</button>
      <button class="view-btn" data-view="maint" id="hm-view-maint">🔧 Maintenance</button>
      <hr style="border:none;border-top:1px solid var(--border);margin:6px 0">
      <button class="view-btn" id="hm-view-refresh" style="color:var(--muted)">↻ Refresh</button>
      <span class="hm-user" id="hm-user"></span>
      <button class="hm-logout" id="hm-logout">Sign Out</button>
    </div>
  </div>

  <div class="gs-results" id="gs-results"></div>

  <div class="main">
    <div class="left-panel">
      <div class="dn-bar" id="dn-bar">
        <div><span class="dn-label">&#128203; Daily Note</span><button class="date-nav-btn" id="date-prev">◀</button><input type="date" id="dash-date" class="dash-date"><button class="date-nav-btn" id="date-next">▶</button><span class="dn-saved" id="dn-saved">Saved</span></div>
        <input type="text" id="dn-input" placeholder="Note for today..." autocomplete="off">
      </div>
      <div class="bookings-row" id="booking-cards"></div>
      <div class="catalog-scroll" id="item-grid"></div>
      <div id="dash-view" class="dash-scroll" style="display:none"></div>
      <div id="cal-nav" class="cal-nav" style="display:none">
        <button id="cal-prev">‹</button>
        <span id="cal-nav-label">May 2026</span>
        <button id="cal-next">›</button>
      </div>
      <div id="cal-view" class="cal-scroll" style="display:none"></div>
      <div id="maint-view" class="maint-scroll" style="display:none"></div>
      <div id="fin-view" class="fin-scroll" style="display:none">
        <div class="fin-nav">
          <button id="fin-prev">‹</button>
          <span id="fin-nav-label">May 2026</span>
          <button id="fin-next">›</button>
        </div>
        <div id="fin-content"></div>
      </div>
      <div id="pricing-view" class="pricing-scroll" style="display:none">
        <div class="pricing-nav">
          <button id="pricing-prev">‹</button>
          <span id="pricing-nav-label">May 2026</span>
          <button id="pricing-next">›</button>
        </div>
        <div class="pricing-tabs">
          <button class="pricing-tab active" data-tab="calendar">Calendar</button>
          <button class="pricing-tab" data-tab="seasons">Seasons</button>
          <button class="pricing-tab" data-tab="events">Events</button>
          <button class="pricing-tab" data-tab="rules">Rules</button>
          <button class="pricing-tab" data-tab="audit">Audit</button>
        </div>
        <div id="pricing-content"></div>
      </div>
    </div>

    <div class="ticket-panel" id="ticket-panel" style="display:none">
      <div class="ticket-header">
        <span id="ticket-heading">Select a booking</span>
        <button class="th-receipt" id="ticket-receipt-btn" style="display:none" title="Reissue receipt">🖨</button>
        <button class="th-edit" id="ticket-edit-btn" style="display:none">Edit</button>
        <button class="th-close" id="ticket-close">×</button>
      </div>
      <div class="room-selector" id="room-selector" style="display:none"></div>
      <div id="ticket-error"></div>
      <div id="pay-error"></div>
      <div id="pay-success"></div>
      <div class="ticket-items" id="ticket-items">
        <div class="ticket-empty">Select a booking to start.</div>
      </div>
      <div class="ticket-footer">
        <div class="ticket-total" id="ticket-total"></div>
        <div class="ticket-actions">
          <button class="btn-save" id="save-ticket">Save</button>
          <button class="btn-pay" id="pay-ticket">Pay</button>
          <button class="btn-receipt" id="receipt-ticket" style="display:none">🖨 Receipt</button>
          <span id="ticket-save-indicator">Saving…</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Login screen -->
<div id="login-overlay">
  <div class="login-box">
    <h2>LGF Dashboard</h2>
    <p>Sign in with your WordPress admin account.</p>
    <input type="text" id="login-user" placeholder="Username" autocomplete="off">
    <input type="password" id="login-pass" placeholder="Password" autocomplete="off">
    <button id="login-btn">Sign In</button>
    <div id="login-error"></div>
    <div class="login-hint" id="login-hint"></div>
  </div>
</div>

<!-- Pay modal -->
<div class="modal-overlay" id="pay-modal">
  <div class="modal-box">
    <button class="modal-close" id="pay-modal-close">×</button>
    <h2>Confirm Payment</h2>
    <div id="pay-items-list"></div>
    <div class="pay-custom-row">
      <label for="pay-custom-amount">Custom amount (€):</label>
      <input type="number" id="pay-custom-amount" step="0.01" min="0" placeholder="Auto from selection">
    </div>
    <div class="pay-total" id="pay-total"></div>
    <div id="pay-modal-error"></div>
    <div style="margin:8px 0;">
      <label><input type="checkbox" id="pay-skip-receipt"> Skip receipt screen</label>
    </div>
    <div class="pay-actions">
      <button class="btn-pay-confirm" id="pay-confirm">Pay with Terminal</button>
      <button class="btn-pay-cancel" id="pay-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Check-in modal -->
<div class="modal-overlay" id="ci-modal">
  <div class="modal-box" style="max-width:520px">

<script>
(function(){
var REST_BASE = 'https://lagrangefleurie.fr/wp-json/simple-hotel-crm/v1/';
var AUTH_KEY = 'lgf_terminal_key';
var FIRST_NAME_KEY = 'lgf_terminal_name';

var state = {
    date: '',
    bookings: [],
    catalog: [],
    roomsByBooking: {},
    activeBookingId: 0,
    activeRoomId: 0,
    bookingRooms: [],
    ticketItems: [],
    savedItems: [],
    roomNights: [],
    activeBooking: null,
    tempIdCounter: 0,
    viewMode: localStorage.getItem('shc_viewMode')||'dash',
    calDate: '',
    calRooms: [],
    calOccupancy: [],
    calDailyNotes: [],
    calDinnerCounts: {},
    calExtrasMap: {},
    finYear: 0,
    finMonth: 0,
    finData: null,
    finQtrs: [],
    pricingMonth: 0,
    pricingYear: 0,
    pricingData: null,
    pricingTab: 'calendar',
    maintNotes: [],
    dailyNotes: [],
    occupancy: [],
    rooms: [],
};

/* ---- Auth ---- */
function getAuth(){ try{return localStorage.getItem(AUTH_KEY)||''}catch(e){return ''} }
function setAuth(v){ try{localStorage.setItem(AUTH_KEY,v)}catch(e){} }
function removeAuth(){ try{localStorage.removeItem(AUTH_KEY);localStorage.removeItem(FIRST_NAME_KEY)}catch(e){} }

function showLogin(msg){
    var overlay=document.getElementById('login-overlay');
    overlay.style.display='flex';
    document.getElementById('app').style.display='none';
    var errEl=document.getElementById('login-error');
    if(msg){
        errEl.textContent=msg;
        errEl.style.display='block';
    }else{
        errEl.style.display='none';
    }
    document.getElementById('login-user').focus();
}
function hideLogin(){
    document.getElementById('login-overlay').style.display='none';
    document.getElementById('app').style.display='flex';
}

function doLogin(){
    var btn=document.getElementById('login-btn');
    btn.disabled=true;
    btn.textContent='Signing in…';
    var errEl=document.getElementById('login-error');
    errEl.style.display='none';
    var hintEl=document.getElementById('login-hint');
    hintEl.textContent='';

    var username=document.getElementById('login-user').value.trim();
    var password=document.getElementById('login-pass').value;

    if(!username||!password){
        errEl.textContent='Please enter your WordPress username and password.';
        errEl.style.display='block';
        btn.disabled=false;
        btn.textContent='Sign In';
        return;
    }

    // Safety timeout: re-enable button after 20s if fetch hangs
    var safetyTimer=setTimeout(function(){
        btn.disabled=false;
        btn.textContent='Sign In';
        errEl.textContent='Request timed out. Check your connection.';
        errEl.style.display='block';
    },20000);

    var controller=new AbortController();
    var timeoutTimer=setTimeout(function(){controller.abort();},15000);

    fetch(REST_BASE+'ticket-auth',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:username,password:password}),
        signal:controller.signal,
    }).then(function(r){
        clearTimeout(safetyTimer);
        clearTimeout(timeoutTimer);
        if(r.status===401){
            throw new Error('Invalid username or password.');
        }
        if(!r.ok){
            return r.text().then(function(body){
                throw new Error('Server error '+r.status+': '+(body||r.statusText).slice(0,300));
            });
        }
        return r.json();
    }).then(function(data){
        setAuth(data.api_key);
        try{localStorage.setItem(FIRST_NAME_KEY,data.name)}catch(e){}
        setUserLabel(data.name);
        document.getElementById('login-pass').value='';
        document.getElementById('login-user').value='';
        hideLogin();
        fetchData();
    }).catch(function(err){
        clearTimeout(safetyTimer);
        clearTimeout(timeoutTimer);
        if(err.name==='AbortError'){
            errEl.textContent='Request timed out. Check your connection and try again.';
        }else{
            removeAuth();
            errEl.textContent=err.message||'Connection failed. Check your network.';
        }
        errEl.style.display='block';
        btn.disabled=false;
        btn.textContent='Sign In';
    });
}

function doLogout(){
    removeAuth();
    showLogin();
}

function setUserLabel(name){
    document.getElementById('user-label').textContent=name||'';
    document.getElementById('hm-user').textContent=name||'';
}

/* ---- Helpers ---- */
function el(tag, attrs, children){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){
        if(k==='className') e.className=attrs[k];
        else if(k==='style'&&typeof attrs[k]==='object') for(var sk in attrs[k]) e.style[sk]=attrs[k][sk];
        else if(k.indexOf('on')===0&&typeof attrs[k]==='function') e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
        else if(k==='htmlFor') e.htmlFor=attrs[k];
        else e.setAttribute(k,attrs[k]);
    }
    if(children){
        if(typeof children==='string') e.textContent=children;
        else if(Array.isArray(children)) for(var i=0;i<children.length;i++){
            var c=children[i]; if(c==null) continue;
            if(typeof c==='string') e.appendChild(document.createTextNode(c));
            else e.appendChild(c);
        }
        else if(children instanceof Node) e.appendChild(children);
    }
    return e;
}
function qsa(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function setText(id,t){var e=document.getElementById(id);if(e)e.textContent=t}
function setHTML(id,h){var e=document.getElementById(id);if(e)e.innerHTML=h}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function showError(msg){
    var el=document.getElementById('ticket-error');
    if(el){el.textContent=msg;el.style.display='block';setTimeout(function(){el.style.display='none'},4000);}
}
function toggleHm(){
    var m=document.getElementById('hm-menu');
    m.classList.toggle('active');
}
function closeHm(){
    document.getElementById('hm-menu').classList.remove('active');
}

function apiGet(path){
    var key=getAuth();
    var sep=path.indexOf('?')===-1?'?':'&';
    return fetch(REST_BASE+path+sep+'api_key='+encodeURIComponent(key),{
        headers:{},
    }).then(function(r){
        if(r.status===401){removeAuth();showLogin('Session expired. Please sign in again.');throw new Error('unauthorized');}
        return r.text().then(function(text){
            if(!r.ok) throw new Error((r.status||'')+' '+(r.statusText||'')+'\n'+(text||'').slice(0,500));
            try{return JSON.parse(text)}catch(e){throw new Error('Invalid JSON response: '+(text||'').slice(0,200));}
        });
    });
}
function apiPost(path,body,method){
    var key=getAuth();
    body=body||{};
    body.api_key=key;
    var sep=path.indexOf('?')===-1?'?':'&';
    return fetch(REST_BASE+path+sep+'api_key='+encodeURIComponent(key),{
        method:method||'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),
    }).then(function(r){
        if(r.status===401){removeAuth();showLogin('Session expired. Please sign in again.');throw new Error('unauthorized');}
        return r.text().then(function(text){
            if(!r.ok) throw new Error((r.status||'')+' '+(r.statusText||'')+'\n'+(text||'').slice(0,500));
            try{return JSON.parse(text)}catch(e){throw new Error('Invalid JSON response: '+(text||'').slice(0,200));}
        });
    });
}

/* ---- Data ---- */
function fetchData(){
    var params=new URLSearchParams({date:state.date,_:Date.now()});
    if(state.activeBookingId>0) params.set('booking_id',state.activeBookingId);
    return apiGet('ticket-data?'+params.toString()).then(function(data){
        state.bookings=data.bookings||[];
        if(data.catalog) state.catalog=data.catalog;
        state.roomsByBooking=data.rooms_by_booking||{};
        state.dailyNotes=data.daily_notes||[];
        state.occupancy=data.occupancy||[];
        state.rooms=data.rooms||[];
        if(state.activeBookingId>0){
            state.savedItems=data.items||[];
            state.bookingRooms=data.booking_rooms||[];
            state.roomNights=data.room_nights||[];
            state.ticketItems=(data.items||[]).map(function(item){
                return {id:item.id,name:item.item_name,qty:parseInt(item.quantity,10),price:parseFloat(item.unit_price),stay_date:item.stay_date||null,booking_room_id:item.booking_room_id||null};
            });
        }else{
            state.savedItems=[];state.bookingRooms=[];state.roomNights=[];state.ticketItems=[];
        }
        render();
        return data;
    }).catch(function(err){
        if(err.message==='unauthorized') return;
        showError(err.message||'Failed to load data.');
    });
}

function goFinMonth(delta){
    state.finMonth+=delta;
    if(state.finMonth<1){state.finMonth=12;state.finYear--;}
    if(state.finMonth>12){state.finMonth=1;state.finYear++;}
    fetchFinances();
}

function fetchFinances(){
    var y=state.finYear||parseInt(state.date.slice(0,4),10);
    var m=state.finMonth||parseInt(state.date.slice(5,7),10);
    state.finYear=y;state.finMonth=m;
    return apiGet('ticket-finances?year='+y+'&month='+m+'&_='+Date.now()).then(function(data){
        state.finData=data;
        document.getElementById('fin-nav-label').textContent=data.month.label;
        renderFinances();
    }).catch(function(err){
        if(err.message==='unauthorized') return;
        document.getElementById('fin-content').innerHTML='<div class="mt-empty">Failed to load finances.</div>';
    });
}

function renderFinances(){
    var d=state.finData;
    if(!d){fetchFinances();return;}
    var m=d.month, yl=d.yearly;
    state.finQtrs=d.quarters||[];
    var root=document.getElementById('fin-content');

    var cards=[
        el('div',{className:'fin-card'},[
            el('div',{className:'fin-card-title'},['Total Income (excl. TdS)']),
            el('div',{className:'fin-card-amount green'},[(m.total_income-m.taxe_sejour).toFixed(2)+'\u20AC']),
            el('div',{className:'fin-card-sub'},[m.label]),
        ]),
        el('div',{className:'fin-card'},[
            el('div',{className:'fin-card-title'},['Taxe de S\u00e9jour']),
            el('div',{className:'fin-card-amount orange'},[m.taxe_sejour.toFixed(2)+'\u20AC']),
            el('div',{className:'fin-card-sub'},[m.adults+' adults \u00B7 '+m.children+' children']),
        ]),
        el('div',{className:'fin-card'},[
            el('div',{className:'fin-card-title'},['Last Quarter']),
            el('div',{className:'fin-card-amount green'},[
                (function(){
                    var curQ=Math.ceil(m.month/3);
                    var prevQIdx=curQ-2;
                    var qtrs=state.finQtrs||[];
                    if(prevQIdx>=0&&prevQIdx<qtrs.length){
                        return qtrs[prevQIdx].total_excl_tax.toFixed(2)+'\u20AC';
                    }
                    return '\u2014';
                })()
            ]),
            el('div',{className:'fin-card-sub'},[
                (function(){
                    var curQ=Math.ceil(m.month/3);
                    var prevQIdx=curQ-2;
                    var qtrs=state.finQtrs||[];
                    if(prevQIdx>=0&&prevQIdx<qtrs.length){
                        return qtrs[prevQIdx].label;
                    }
                    return 'N/A (prev. year)';
                })()
            ]),
        ]),
        el('div',{className:'fin-card'},[
            el('div',{className:'fin-card-title'},['Occupancy']),
            el('div',{className:'fin-card-amount blue'},[m.occupancy_pct+'%']),
            el('div',{className:'fin-card-sub'},[m.occupied_nights+' / '+m.total_nights+' nights \u00B7 ADR '+m.adr.toFixed(2)+'\u20AC']),
        ]),
    ];

    var breakdown=el('div',{className:'fin-card',style:'grid-column:1/-1'},[
        el('div',{className:'fin-card-title'},['Revenue Breakdown']),
        el('div',{className:'fin-breakdown'},[
            el('div',{className:'bd-item'},[el('span',{className:'bd-label'},['Room revenue']),el('span',{className:'bd-val'},[m.room_revenue.toFixed(2)+'\u20AC'])]),
            el('div',{className:'bd-item'},[el('span',{className:'bd-label'},['Commission']),el('span',{className:'bd-val'},['-'+(m.commission_revenue||0).toFixed(2)+'\u20AC'])]),
            el('div',{className:'bd-item'},[el('span',{className:'bd-label'},['Items (dinner, etc.)']),el('span',{className:'bd-val'},[m.items_revenue.toFixed(2)+'\u20AC'])]),
            el('div',{className:'bd-item'},[el('span',{className:'bd-label'},['Taxe de s\u00e9jour']),el('span',{className:'bd-val'},[m.taxe_sejour.toFixed(2)+'\u20AC'])]),
            el('div',{className:'bd-item',style:'border-top:1px solid var(--border);padding-top:4px;margin-top:4px;font-weight:700'},[el('span',{className:'bd-label'},['Total (excl. TdS)']),el('span',{className:'bd-val'},[(m.total_income-m.taxe_sejour).toFixed(2)+'\u20AC'])]),
        ]),
    ]);

    // Quarters card
    var qtrs=state.finQtrs||[];
    var yrQtrTotal=qtrs.reduce(function(s,q){return s+q.total_excl_tax;},0);
    var qtrCard=el('div',{className:'fin-card',style:'grid-column:1/-1'},[
        el('div',{className:'fin-card-title'},['Quarters — '+state.finYear+' (excl. TdS)']),
        el('div',{style:'display:flex;gap:12px;text-align:center'},qtrs.map(function(q){
            return el('div',{style:'flex:1;min-width:0'},[
                el('div',{className:'fin-row-label'},[q.label]),
                el('div',{className:'fin-row-amount green'},[q.total_excl_tax.toFixed(2)+'\u20AC']),
            ]);
        }).concat(el('div',{style:'flex:1;min-width:0'},[
            el('div',{className:'fin-row-label'},['Year Total']),
            el('div',{className:'fin-row-amount green'},[yrQtrTotal.toFixed(2)+'\u20AC']),
        ]))),
    ]);

    // Year-to-date table
    var yrRows=yl.map(function(ym){
        var months=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var isCur=ym.month===m.month;
        return el('tr',{className:isCur?'':'',style:isCur?'font-weight:700;color:var(--text)':''},[
            el('td',{},[months[ym.month]]),
            el('td',{className:'num'},[ym.room_revenue.toFixed(2)]),
            el('td',{className:'num'},[ym.items_revenue.toFixed(2)]),
            el('td',{className:'num'},[(ym.commission_revenue||0).toFixed(2)]),
            el('td',{className:'num'},[ym.taxe_sejour.toFixed(2)]),
            el('td',{className:'num'},[(ym.room_revenue+ym.items_revenue).toFixed(2)]),
        ]);
    });

    var yrTotal=yl.reduce(function(s,ym){return s+ym.room_revenue+ym.items_revenue;},0);
    yrRows.push(el('tr',{style:'font-weight:700;border-top:2px solid var(--border)'},[
        el('td',{},['Total']),
        el('td',{className:'num'},['']),
        el('td',{className:'num'},['']),
        el('td',{className:'num'},['']),
        el('td',{className:'num'},['']),
        el('td',{className:'num'},[yrTotal.toFixed(2)+'\u20AC']),
    ]));

    var yrCard=el('div',{className:'fin-card',style:'grid-column:1/-1'},[
        el('div',{className:'fin-card-title'},['Year '+state.finYear+' \u2014 Monthly Breakdown']),
        el('table',{className:'fin-table'},[
            el('thead',{},[el('tr',{},[
                el('th',{},['Month']),
                el('th',{className:'num'},['Room']),
                el('th',{className:'num'},['Items']),
                el('th',{className:'num'},['Commission']),
                el('th',{className:'num'},['Taxe de S\u00e9jour']),
                el('th',{className:'num'},['Total (excl. TdS)']),
            ])]),
            el('tbody',{},yrRows),
        ]),
    ]);

    root.innerHTML='';
    var grid=el('div',{className:'fin-grid'},[].concat(cards,[breakdown,qtrCard,yrCard]));
    root.appendChild(grid);
}

function setViewMode(mode){
    state.viewMode=mode;
    try{localStorage.setItem('shc_viewMode',mode);}catch(e){}
    qsa('.view-btn').forEach(function(b){
        b.classList.toggle('active',b.getAttribute('data-view')===mode);
    });
    render();
}

/* ---- Dashboard ---- */
function renderDashboard(){
    var root=document.getElementById('dash-view');
    var todayStr=state.date;

    function roomLabel(b){
        var rooms=state.roomsByBooking[b.id]||[];
        return rooms.map(function(r){return r.room_code;}).join(', ');
    }
    function guestName(b){
        return ((b.first_name||'')+' '+(b.last_name||'')).trim()||'#'+b.id;
    }
    function statusLabel(b){
        if(b.check_out_date===todayStr) return {text:'Out',cls:'label-out'};
        if(b.check_in_date===todayStr) return {text:'In',cls:'label-in'};
        return {text:'Stay',cls:'label-stay'};
    }
    function channelBadge(b){
        if(!b.source_channel||b.source_channel==='direct') return null;
        return el('span',{className:'ch-badge'},[b.source_channel]);
    }

    root.innerHTML='';
    var grid=el('div',{className:'dash-grid'});

    // Card 1: Arrivals / Departures
    var arrDepCard=el('div',{className:'dash-card'});
    arrDepCard.appendChild(el('div',{className:'dash-card-header'},['Bookings Today']));
    var arrDepBody=el('div',{className:'dash-card-body'});

    var totalIn=0,totalOut=0,totalStay=0;
    state.bookings.forEach(function(b){
        var sl=statusLabel(b);
        if(sl.text==='In') totalIn++;
        else if(sl.text==='Out') totalOut++;
        else totalStay++;
    });
    arrDepBody.appendChild(el('div',{className:'dash-stats'},[
        el('div',{className:'dash-stat dash-stat-arr'},[
            el('div',{className:'dash-stat-num'},[String(totalIn)]),
            el('div',{className:'dash-stat-label'},['In']),
        ]),
        el('div',{className:'dash-stat dash-stat-dep'},[
            el('div',{className:'dash-stat-num'},[String(totalOut)]),
            el('div',{className:'dash-stat-label'},['Out']),
        ]),
        el('div',{className:'dash-stat dash-stat-room'},[
            el('div',{className:'dash-stat-num'},[String(totalStay)]),
            el('div',{className:'dash-stat-label'},['Stay']),
        ]),
    ]));

    // Guest list
    var guestList=el('div',{className:'dash-guest-list'});
    if(state.bookings.length===0){
        guestList.appendChild(el('div',{className:'dash-empty'},['No bookings today.']));
    }else{
        state.bookings.forEach(function(b){
            var sl=statusLabel(b);
            var rooms=state.roomsByBooking[b.id]||[];
            var roomLabels=rooms.map(function(r){return r.room_code;}).join(', ');
            var name=guestName(b);
            var row=el('div',{
                className:'dash-guest',
                onClick:function(){selectBooking(parseInt(b.id,10));}
            },[
                el('span',{className:'dash-label '+sl.cls},[sl.text]),
                el('div',{className:'dash-guest-name'},[name+(parseInt(b.dinner_count,10)>0?' \uD83C\uDF7D\u00D7'+b.dinner_count:'')]),
                roomLabels?el('div',{className:'dash-guest-room'},[roomLabels]):null,
            ]);
            guestList.appendChild(row);
        });
    }
    arrDepBody.appendChild(guestList);
    arrDepCard.appendChild(arrDepBody);
    grid.appendChild(arrDepCard);

    // Card 2: Next 7 Days
    var occCard=el('div',{className:'dash-card'});
    occCard.appendChild(el('div',{className:'dash-card-header'},['Next 7 Days']));
    var occBody=el('div',{className:'dash-card-body'});
    occCard.appendChild(occBody);
    grid.appendChild(occCard);

    var rooms=state.rooms;
    var weekDates=[];
    for(var i=0;i<7;i++){
        var d=new Date(todayStr);
        d.setDate(d.getDate()+i);
        var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        weekDates.push(ds);
    }
    if(rooms.length===0){
        occBody.appendChild(el('div',{className:'dash-empty'},['No room data.']));
    }else{
        var occByDate={};
        state.occupancy.forEach(function(o){
            if(!occByDate[o.stay_date]) occByDate[o.stay_date]={};
            occByDate[o.stay_date][o.room_code]=o;
        });

        var occTable=el('div',{className:'dash-occ-table'});
        var hdrRow=el('div',{className:'dash-occ-row'});
        hdrRow.appendChild(el('div',{className:'dash-occ-room',style:'background:var(--bg)'},['']));
        weekDates.forEach(function(ds){
            var dt=new Date(ds+'T12:00:00');
            var isToday=ds===todayStr;
            var cell=el('div',{className:'dash-occ-date'+(isToday?' dash-occ-today':'')},[
                String(dt.getDate())
            ]);
            hdrRow.appendChild(cell);
        });
        occTable.appendChild(hdrRow);

        rooms.forEach(function(rm){
            var row=el('div',{className:'dash-occ-row'});
            row.appendChild(el('div',{className:'dash-occ-room'},[rm.room_code]));
            weekDates.forEach(function(ds){
                var occ=occByDate[ds]&&occByDate[ds][rm.room_code];
                var isToday=ds===todayStr;
                var cls='dash-occ-cell'+(isToday?' dash-occ-today':'');
                if(occ){
                    var guests=occ.guest_count||'';
                    cls+=' dash-occ-checked_in';
                    row.appendChild(el('div',{className:cls},[String(guests)]));
                }else{
                    cls+=' dash-occ-free';
                    row.appendChild(el('div',{className:cls},['']));
                }
            });
            occTable.appendChild(row);
        });
        occBody.appendChild(occTable);
    }

    // Card 3: Bread Order (matching standalone dashboard)
    var breadCard=el('div',{className:'dash-card'});
    breadCard.appendChild(el('div',{className:'dash-card-header'},['Bread Order']));
    var breadBody=el('div',{className:'dash-card-body'});
    breadCard.appendChild(breadBody);
    grid.appendChild(breadCard);

    // Aggregate guest counts per day from occupancy
    var guestByDate={};
    state.occupancy.forEach(function(o){
        if(!guestByDate[o.stay_date]){
            guestByDate[o.stay_date]={adults:0,children:0,total:0};
        }
        var a=parseInt(o.adults,10)||0;
        var c=parseInt(o.children,10)||0;
        guestByDate[o.stay_date].adults+=a;
        guestByDate[o.stay_date].children+=c;
        guestByDate[o.stay_date].total+=a+c;
    });

    function fmtDate(ds){
        var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        var dt=new Date(ds+'T12:00:00');
        return days[dt.getDay()]+' '+String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0');
    }

    var breadDates=[];
    for(var i=0;i<7;i++){
        var d=new Date(state.date+'T12:00:00');
        d.setDate(d.getDate()+i);
        var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        breadDates.push(ds);
    }

    var breadScroll=el('div',{className:'bread-scroll'});
    breadDates.forEach(function(ds,i){
        var prevCount=0;
        var prevDate;
        if(i===0){
            var d=new Date(state.date+'T12:00:00');
            d.setDate(d.getDate()-1);
            prevDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        }else{
            prevDate=breadDates[i-1];
        }
        var g=guestByDate[prevDate];
        if(g) prevCount=g.total;
        var isToday=ds===todayStr;
        var dayBox=el('div',{className:'bread-day'+(isToday?' today':'')});
        dayBox.appendChild(el('div',{className:'bd-date'},[fmtDate(ds)]));
        if(prevCount===0){
            dayBox.appendChild(el('div',{className:'bd-empty'},['No guests']));
        }else{
            var croissants=prevCount;
            var baguettes=Math.ceil(prevCount/4);
            dayBox.appendChild(el('div',{className:'bd-row',style:'color:var(--muted);font-size:11px'},[
                el('span',{},['Based on']),
                el('span',{},[fmtDate(prevDate)]),
            ]));
            dayBox.appendChild(el('div',{className:'bd-row'},[
                el('span',{},['\uD83E\uDD50 Croissants']),
                el('span',{},[String(croissants)]),
            ]));
            dayBox.appendChild(el('div',{className:'bd-row'},[
                el('span',{},['\uD83E\uDD56 Baguettes']),
                el('span',{},[String(baguettes)]),
            ]));
        }
        breadScroll.appendChild(dayBox);
    });
    breadBody.appendChild(breadScroll);
    breadBody.appendChild(el('div',{className:'bd-scroll-hint'},['\u2190 Scroll for more days \u2192']));

    // Card 4: Notes
    root.appendChild(grid);

    var notesCard=el('div',{className:'dash-card',style:'margin-top:0'});
    notesCard.appendChild(el('div',{className:'dash-card-header'},['Notes']));
    var notesBody=el('div',{className:'dash-card-body'});

    if(state.dailyNotes.length===0){
        notesBody.appendChild(el('div',{className:'dash-notes-empty'},['No notes this month.']));
    }else{
        var notesTable=el('div',{className:'dash-notes-table'});
        state.dailyNotes.forEach(function(n){
            var row=el('div',{className:'dash-notes-row'});
            row.appendChild(el('div',{className:'dash-notes-date'},[n.note_date]));
            row.appendChild(el('div',{className:'dash-notes-text',style:n.note_text?'':'color:var(--muted)'},[n.note_text||'(empty)']));
            notesTable.appendChild(row);
        });
        notesBody.appendChild(notesTable);
    }
    notesCard.appendChild(notesBody);
    root.appendChild(notesCard);
}
